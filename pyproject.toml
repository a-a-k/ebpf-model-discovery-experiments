[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebpf-model-discovery-experiments"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "PyYAML>=6,<7", "numpy>=2,<3", "ijson==3.4.0", "aiohttp==3.14.5"]

[project.optional-dependencies]
report = ["matplotlib==3.10.9"]

[tool.setuptools.packages.find]
where = ["src"]
