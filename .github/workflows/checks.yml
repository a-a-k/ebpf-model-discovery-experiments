name: Focused implementation checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  capture-publication-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest opentelemetry-proto
      - name: Exercise actual capture publication and forced failure with upstream star filenames
        run: |
          mkdir -p work
          python -m pytest tests/test_capture_publication.py --basetemp work/capture-publication-fixture
      - name: Upload only the safe outer fallback containers
        uses: actions/upload-artifact@v4
        with:
          name: capture-publication-fixture-${{ github.run_id }}
          path: work/capture-publication-fixture/**/target-*.tar.gz*
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: capture-publication-fixture-${{ github.run_id }}
          path: work/capture-publication-delivered
      - name: Verify downloaded fallback bytes and upstream names inside the container
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, tarfile
          paths = list(pathlib.Path('work/capture-publication-delivered').rglob('*.tar.gz'))
          assert len(paths) == 4
          stars = 0
          for path in paths:
              info = json.loads(path.with_name(path.name + '.json').read_bytes())
              assert hashlib.sha256(path.read_bytes()).hexdigest() == info['sha256']
              with tarfile.open(path) as archive:
                  stars += any('*' in name for name in archive.getnames())
          assert stars == 2
          PY
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' pytest opentelemetry-proto
      - run: python -m compileall -q src systems
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: python -m pytest --import-mode=importlib tests systems
        env:
          PYTHONPATH: .
  control-fixture-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest opentelemetry-proto
      - name: Execute pinned HAProxy technical control fixture
        run: python -m pytest --import-mode=importlib tests/test_collectors_v5.py -k pinned_haproxy_control_fixture_executes
        env:
          PYTHONPATH: .
          RUN_DOCKER_CONTROL_FIXTURE: '1'
      - name: Validate fresh deployment settings with the actual Compose parser
        run: python -m pytest --import-mode=importlib tests/test_deployment_v6.py
        env:
          PYTHONPATH: .
          RUN_DOCKER_CONTROL_FIXTURE: '1'
  identical-input-discovery-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest opentelemetry-proto
      - name: Build the existing exact graph-v5 product pins
        run: bash scripts/setup-toolchain-v4.sh work/toolchain-build v5
      - name: Check two genuine discoveries and four logical input views
        run: python scripts/check-identical-input-discovery-v5.py
      - name: Check corrected predicates with the actual pinned model products
        run: python scripts/check-compose-contract-products.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: identical-input-discovery-${{ github.run_id }}
          path: |
            work/identical-input-discovery-fixture/
            work/compose-contract-product-fixture/
            work/toolchain-build/toolchain-build.json
            work/toolchain-build/builds.tsv
            work/toolchain-build/logs/
          retention-days: 90
          if-no-files-found: error
