name: Iteration 4 immutable OTel training-checkpoint diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install experiment package
        run: python -m pip install -e . opentelemetry-proto
      - name: Admit the one immutable checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: '40718665137'
          SOURCE_ARTIFACT: '12830934533'
          SOURCE_NAME: training-v4-otel_demo-full-6-40718665137
          SOURCE_DIGEST: sha256:47def427dfe5dd7509b0d31b3198affef8dc25dabd69a2c6e551824d4b0f0a1c
          SOURCE_HEAD: ea2e278e50f64bd50597c243d84f834be1b92576
          MANIFEST_SHA256: 1947882e9a8ce92732ca31e14907afde9c5def9dd33050658b2e66440b14e765
        run: |
          mkdir -p work/diagnostic/source-metadata work/original
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > work/diagnostic/source-metadata/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT" > work/diagnostic/source-metadata/artifact.json
          python - <<'PY'
          import json, os, pathlib
          run=json.loads(pathlib.Path('work/diagnostic/source-metadata/run.json').read_text())
          artifact=json.loads(pathlib.Path('work/diagnostic/source-metadata/artifact.json').read_text())
          expected={'run_id':int(os.environ['SOURCE_RUN']),'artifact_id':int(os.environ['SOURCE_ARTIFACT']),
              'artifact_name':os.environ['SOURCE_NAME'],'artifact_digest':os.environ['SOURCE_DIGEST'],
              'run_sha':os.environ['SOURCE_HEAD'],'expired':False,
              'manifest_sha256':os.environ['MANIFEST_SHA256']}
          if (run.get('id') != expected['run_id'] or run.get('head_sha') != expected['run_sha']
                  or artifact.get('id') != expected['artifact_id']
                  or artifact.get('name') != expected['artifact_name']
                  or artifact.get('digest') != expected['artifact_digest']
                  or artifact.get('expired') is True
                  or (artifact.get('workflow_run') or {}).get('id') != expected['run_id']
                  or (artifact.get('workflow_run') or {}).get('head_sha') != expected['run_sha']):
              raise SystemExit('immutable checkpoint Actions metadata mismatch')
          expected.update(run_status=run.get('status'),run_conclusion=run.get('conclusion'),
              run_url=run.get('html_url'),artifact_bytes=artifact.get('size_in_bytes'),
              source_workflow_path=run.get('path'))
          pathlib.Path('work/diagnostic/source-metadata/source-artifact.json').write_text(
              json.dumps(expected,indent=2)+'\n')
          PY
      - name: Download and verify the original artifact archive
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT: '12830934533'
          SOURCE_DIGEST_HEX: 47def427dfe5dd7509b0d31b3198affef8dc25dabd69a2c6e551824d4b0f0a1c
        run: |
          mkdir -p work/diagnostic/infrastructure
          /usr/bin/time -v -o work/diagnostic/infrastructure/download-time.txt \
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT/zip" \
            > work/checkpoint.zip
          printf '%s  %s\n' "$SOURCE_DIGEST_HEX" work/checkpoint.zip \
            > work/diagnostic/source-metadata/archive.sha256
          sha256sum --check work/diagnostic/source-metadata/archive.sha256
          /usr/bin/time -v -o work/diagnostic/infrastructure/extract-time.txt \
            unzip -q work/checkpoint.zip -d work/original
          du -B1 -s work/checkpoint.zip work/original > work/diagnostic/infrastructure/source-disk-bytes.txt
      - name: Allocate measured swap on the standard runner
        env:
          GITHUB_ACTIONS: 'true'
        run: bash scripts/setup-v4-swap.sh work/diagnostic/infrastructure/swap
      - name: Run the unchanged full-prefix toolchain diagnostic
        env:
          PYTHONPATH: src
        run: |
          set +e
          bash scripts/capture-v4-resources.sh \
            work/diagnostic/infrastructure/resources 15 work/no-guests &
          sampler=$!
          printf '%s\n' "$sampler" > work/diagnostic/infrastructure/resource-sampler.pid
          /usr/bin/time -v -o work/diagnostic/infrastructure/diagnostic-time.txt \
            python -m ebpf_discovery.checkpoint_diagnostic_v4 \
              --original work/original --out work/diagnostic/output \
              --source work/diagnostic/source-metadata/source-artifact.json
          code=$?
          kill -TERM "$sampler" 2>/dev/null || true
          wait "$sampler" 2>/dev/null || true
          exit "$code"
      - name: Retain final runner and disk evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/diagnostic/infrastructure
          uname -a > work/diagnostic/infrastructure/runner-final.txt
          free -b >> work/diagnostic/infrastructure/runner-final.txt
          swapon --show --bytes >> work/diagnostic/infrastructure/runner-final.txt
          df -B1 >> work/diagnostic/infrastructure/runner-final.txt
          du -B1 -s work/diagnostic work/original work/checkpoint.zip \
            > work/diagnostic/infrastructure/final-disk-bytes.txt 2>&1 || true
          ps -eo pid,ppid,rss,vsz,%cpu,%mem,etimes,comm,args --sort=-rss \
            > work/diagnostic/infrastructure/processes-final.txt
          python -m pip freeze > work/diagnostic/infrastructure/python-environment.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > work/diagnostic/infrastructure/workflow-jobs.json 2>work/diagnostic/infrastructure/workflow-jobs.err || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-v4-otel-training-checkpoint-${{ github.run_id }}
          path: work/diagnostic/
          compression-level: 1
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
