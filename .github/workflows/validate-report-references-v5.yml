name: Validate v5 referenced report payloads
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest ijson
      - name: Run focused referenced-report checks
        run: |
          python -m pytest --import-mode=importlib \
            tests/test_report_v5.py tests/test_validate_report_references_v5.py -q \
            | tee focused-tests.log
          python -m py_compile scripts/validate-report-references-v5.py
          python scripts/validate-report-references-v5.py --help >/dev/null
      - name: Fetch exact immutable saved report metadata and archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/report-reference-validation-input
          gh api repos/a-a-k/ebpf-model-discovery-experiments/actions/runs/40930225342 \
            > work/report-reference-validation-input/run-api.json
          gh api repos/a-a-k/ebpf-model-discovery-experiments/actions/artifacts/12921733573 \
            > work/report-reference-validation-input/artifact-api.json
          gh api -H 'Accept: application/vnd.github+json' \
            repos/a-a-k/ebpf-model-discovery-experiments/actions/artifacts/12921733573/zip \
            > work/report-reference-validation-input/source-report.zip
      - name: Validate exact payload restoration and report equivalence
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/validate-report-references-v5.py \
            --archive work/report-reference-validation-input/source-report.zip \
            --artifact-metadata work/report-reference-validation-input/artifact-api.json \
            --run-metadata work/report-reference-validation-input/run-api.json \
            --out work/report-reference-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-reference-validation-v5-${{ github.run_id }}
          path: |
            work/report-reference-validation/validation.json
            work/report-reference-validation/failure.json
            work/report-reference-validation/referenced-report/
            work/report-reference-validation/source-report/provenance/declarations.json
            work/report-reference-validation/source-report/provenance/retrieval.json
            work/report-reference-validation/source-report/report-v5.md
            work/report-reference-validation/source-report/costs-v5.json
            work/report-reference-validation-input/run-api.json
            work/report-reference-validation-input/artifact-api.json
            focused-tests.log
          retention-days: 90
          if-no-files-found: warn
