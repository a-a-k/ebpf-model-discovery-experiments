name: Adjudicate immutable DeepFlow training clock projection v5
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  adjudicate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Run focused adjudication checks
        run: python -m pytest --import-mode=importlib tests/test_adjudicate_deepflow_clock_v5.py -q | tee focused-tests.log
      - name: Fetch exact immutable source metadata and full artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/deepflow-clock-adjudication-input
          gh api repos/a-a-k/ebpf-model-discovery-experiments/actions/runs/40910393953 \
            > work/deepflow-clock-adjudication-input/run-api.json
          gh api repos/a-a-k/ebpf-model-discovery-experiments/actions/artifacts/12915445515 \
            > work/deepflow-clock-adjudication-input/artifact-api.json
          gh api -H 'Accept: application/vnd.github+json' \
            repos/a-a-k/ebpf-model-discovery-experiments/actions/artifacts/12915445515/zip \
            > work/deepflow-clock-adjudication-input/full.zip
      - name: Derive and verify only the corrected training identity projection
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/adjudicate-deepflow-clock-v5.py \
            --archive work/deepflow-clock-adjudication-input/full.zip \
            --artifact-metadata work/deepflow-clock-adjudication-input/artifact-api.json \
            --run-metadata work/deepflow-clock-adjudication-input/run-api.json \
            --workspace work/deepflow-clock-source-selected \
            --out work/deepflow-clock-adjudication
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepflow-clock-adjudication-v5-${{ github.run_id }}
          path: |
            work/deepflow-clock-adjudication/
            focused-tests.log
          retention-days: 90
          if-no-files-found: error
