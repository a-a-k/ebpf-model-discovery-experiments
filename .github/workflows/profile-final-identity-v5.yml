name: Fixed saved final identity resolver diagnostic
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Retain exact diagnostic driver and source identity
        run: |
          echo "FINAL_PROFILE_ROOT=$RUNNER_TEMP/fixed-final-identity-profile" >> "$GITHUB_ENV"
          cp scripts/profile-final-identity-resolution-v5.py "$RUNNER_TEMP/identity-profile-driver.py"
          mkdir -p "$RUNNER_TEMP/identity-profile-results"
          git rev-parse HEAD > "$RUNNER_TEMP/identity-profile-results/driver-Git-source.txt"
          sha256sum "$RUNNER_TEMP/identity-profile-driver.py" > "$RUNNER_TEMP/identity-profile-results/driver-SHA256.txt"
      - name: Verify original full archive and extract only fixed two inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/time -v -o "$RUNNER_TEMP/identity-profile-results/preparation-time.txt" python "$RUNNER_TEMP/identity-profile-driver.py" prepare
      - uses: actions/checkout@v4
        with:
          ref: f7ba801d70f9d2327031efc6dd0c00b90d252708
      - name: Profile fixed read-only original resolver calls
        run: /usr/bin/time -v -o "$RUNNER_TEMP/identity-profile-results/profile-time.txt" python "$RUNNER_TEMP/identity-profile-driver.py" profile
      - name: Retain only diagnostic metadata
        if: always()
        run: |
          for name in preparation.json artifact-api.json zip-stage-file-metadata.json http-retries.jsonl profile.json; do
            if test -f "$FINAL_PROFILE_ROOT/$name"; then
              cp "$FINAL_PROFILE_ROOT/$name" "$RUNNER_TEMP/identity-profile-results/$name"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed-final-identity-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/identity-profile-results
          if-no-files-found: error
          retention-days: 90
