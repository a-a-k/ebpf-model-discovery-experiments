name: Explicit inspected qualification continuation v6
run-name: v6 qualification ${{ inputs.operation }} parent record ${{ inputs.parent_record }}
'on':
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options:
        - inspect
        - replay
        - validate
        default: inspect
        required: true
      parent_record:
        type: string
        required: true
        description: Tracked reviewed docs parent record; no MAIN inputs
      parent_sha256:
        type: string
        required: true
        description: Exact reviewed parent-record Git-LF SHA256
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: src
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
  V6_PARENT_RECORD: ${{ inputs.parent_record }}
  V6_PARENT_SHA256: ${{ inputs.parent_sha256 }}
jobs:
  inspect:
    if: ${{ inputs.operation == 'inspect' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |-
          AGENTS.md
          .github
          docs
          scripts
          src
          systems
          tests
          pyproject.toml
          README.md
        sparse-checkout-cone-mode: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -e . opentelemetry-proto
    - name: Record the actual full inspection host envelope
      run: python -m ebpf_discovery.resources_v6 --report work/inspection-host-resources.json
    - name: Verify the exact reviewed original qualification parent
      id: parent
      run: python -m ebpf_discovery.qualification_replay_v6 preflight --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256 "$V6_PARENT_SHA256"
        --root work
    - name: Download only the allowlisted original common publication
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
      with:
        artifact-ids: ${{ steps.parent.outputs.shared_artifact_id }}
        merge-multiple: true
        run-id: ${{ steps.parent.outputs.parent_run_id }}
        github-token: ${{ github.token }}
        path: work/shared-input
    - name: Inspect common plan, image and VM baseline seals without starting guests
      run: python -m ebpf_discovery.qualification_replay_v6 inspect-shared --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256
        "$V6_PARENT_SHA256" --root work
    - name: Download original none training publication
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
      with:
        artifact-ids: ${{ steps.parent.outputs.none_artifact_id }}
        merge-multiple: true
        run-id: ${{ steps.parent.outputs.parent_run_id }}
        github-token: ${{ github.token }}
        path: work/capture-input/none
    - name: Check immutable none source and sealed journal; release only verified working copy
      run: python -m ebpf_discovery.qualification_replay_v6 inspect-capture --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256
        "$V6_PARENT_SHA256" --root work --collector none
    - name: Download original obi training publication
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
      with:
        artifact-ids: ${{ steps.parent.outputs.obi_artifact_id }}
        merge-multiple: true
        run-id: ${{ steps.parent.outputs.parent_run_id }}
        github-token: ${{ github.token }}
        path: work/capture-input/obi
    - name: Check immutable obi source and sealed journal; release only verified working copy
      run: python -m ebpf_discovery.qualification_replay_v6 inspect-capture --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256
        "$V6_PARENT_SHA256" --root work --collector obi
    - name: Download original coroot training publication
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
      with:
        artifact-ids: ${{ steps.parent.outputs.coroot_artifact_id }}
        merge-multiple: true
        run-id: ${{ steps.parent.outputs.parent_run_id }}
        github-token: ${{ github.token }}
        path: work/capture-input/coroot
    - name: Check immutable coroot source and sealed journal; release only verified working copy
      run: python -m ebpf_discovery.qualification_replay_v6 inspect-capture --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256
        "$V6_PARENT_SHA256" --root work --collector coroot
    - name: Download original deepflow training publication
      uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
      with:
        artifact-ids: ${{ steps.parent.outputs.deepflow_artifact_id }}
        merge-multiple: true
        run-id: ${{ steps.parent.outputs.parent_run_id }}
        github-token: ${{ github.token }}
        path: work/capture-input/deepflow
    - name: Check immutable deepflow source and sealed journal; release only verified working copy
      run: python -m ebpf_discovery.qualification_replay_v6 inspect-capture --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256
        "$V6_PARENT_SHA256" --root work --collector deepflow
    - name: Publish all-four original identity and preparation inspection
      run: python -m ebpf_discovery.qualification_replay_v6 finish-inspection --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256
        "$V6_PARENT_SHA256" --root work
    - name: Retain small continuation provenance and actual costs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: v6-qualification-parent-inspection-${{ github.run_id }}
        path: |-
          work/inspection/
          work/qualification-inspection-report.json
          work/qualification-replay-cost.jsonl
          work/case/processing-publication-verification.json
          work/case/block-controller-cost.jsonl
          work/case/portable-model-write-guard.json
          work/parent-publication-API.json
          work/block-disk-guards.jsonl
          work/inspection-host-resources.json
        if-no-files-found: warn
        compression-level: 6
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        collector:
        - none
        - obi
        - coroot
        - deepflow
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |-
          AGENTS.md
          .github
          docs
          scripts
          src
          systems
          tests
          pyproject.toml
          README.md
        sparse-checkout-cone-mode: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -e . opentelemetry-proto
    - name: Verify the exact reviewed original qualification parent
      id: parent
      run: python -m ebpf_discovery.qualification_replay_v6 preflight --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256 "$V6_PARENT_SHA256"
        --root work
    - name: Prepare full worker resources
      run: python -m ebpf_discovery.resources_v6 --report work/model-host-resources.json
    - name: Publish actual model worker resources before long work
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v6-worker-model-${{ matrix.collector }}-${{ github.run_id }}
        path: work/model-host-resources.json
        if-no-files-found: warn
        compression-level: 6
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
      with:
        artifact-ids: ${{ steps.parent.outputs[format('{0}_artifact_id', matrix.collector)] }}
        merge-multiple: true
        run-id: ${{ steps.parent.outputs.parent_run_id }}
        github-token: ${{ github.token }}
        path: work/capture-input/${{ matrix.collector }}
      name: Download this one exact original qualification arm
    - name: Restore exact approved original training bytes; keep original capture identity
      run: python -m ebpf_discovery.qualification_replay_v6 restore-training --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256
        "$V6_PARENT_SHA256" --root work --collector "${{ matrix.collector }}"
    - name: Build the unchanged pinned Bering and Sheaft tools
      run: |
        bash scripts/setup-toolchain-v4.sh work/tools v5
        echo "PBS_BIN=$(realpath work/tools/bin)" >> "$GITHUB_ENV"
    - name: Compute and freeze forecasts without live application guests
      run: python scripts/observe-v6-model-host.py
    - name: Retain body-free host samples from the actual model computation
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v6-model-host-observer-${{ matrix.collector }}-${{ github.run_id }}
        path: work/model-host-observer.jsonl
        if-no-files-found: warn
        compression-level: 6
    - name: Package immutable models and training provenance
      id: modelpackage
      run: python -m ebpf_discovery.block_v6 package-model --root work/case --out work/model.tar.gz
    - name: Stage complete or partial processing files without a second archive
      if: always()
      run: python -m ebpf_discovery.block_v6 package-processing --root work/case --out work/processing-publication
      id: processing
    - if: ${{ always() && steps.modelpackage.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: v6-model-${{ matrix.collector }}-${{ github.run_id }}
        path: |-
          work/model.tar.gz
          work/model.tar.gz.json
          work/model-host-resources.json
        if-no-files-found: warn
        include-hidden-files: true
        compression-level: 0
    - if: ${{ always() && steps.processing.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: v6-processing-full-${{ matrix.collector }}-${{ github.run_id }}
        path: |-
          work/processing-publication/
          work/case/model-worker-resources.json
          work/case/forecast-saved.json
          work/tools/builds.tsv
          work/tools/pins.tsv
          work/tools/logs/
          work/case/block-controller-cost.jsonl
          work/case/portable-model-write-guard.json
        if-no-files-found: warn
        include-hidden-files: true
        compression-level: 6
      id: processingupload
    - name: Verify source bytes and hard links after streaming upload
      if: ${{ always() && steps.processingupload.outcome == 'success' }}
      env:
        V6_PROCESSING_MANIFEST_SHA: ${{ steps.processing.outputs.manifest_sha256 }}
      run: python -m ebpf_discovery.block_v6 verify-processing-publication --root work/case --out work/processing-publication --manifest-sha256 "$V6_PROCESSING_MANIFEST_SHA"
    - name: Retain small continuation provenance and actual costs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: v6-qualification-replay-${{ inputs.operation }}-${{ github.job }}-${{ matrix.collector || 'block' }}-${{ github.run_id }}
        path: |-
          work/inspection/
          work/qualification-inspection-report.json
          work/qualification-replay-cost.jsonl
          work/case/processing-publication-verification.json
          work/case/block-controller-cost.jsonl
          work/case/portable-model-write-guard.json
          work/parent-publication-API.json
          work/block-disk-guards.jsonl
        if-no-files-found: warn
        compression-level: 6
    if: ${{ inputs.operation == 'replay' }}
  validation:
    if: ${{ always() && ((inputs.operation == 'replay' && needs.model.result == 'success') || (inputs.operation == 'validate' && needs.model.result == 'skipped')) }}
    needs:
    - model
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |-
          AGENTS.md
          .github
          docs
          scripts
          src
          systems
          tests
          pyproject.toml
          README.md
        sparse-checkout-cone-mode: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -e . opentelemetry-proto
    - name: Verify the exact reviewed original qualification parent
      id: parent
      run: python -m ebpf_discovery.qualification_replay_v6 preflight --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256 "$V6_PARENT_SHA256"
        --root work --models-ready
    - name: Prepare full worker resources
      run: python -m ebpf_discovery.resources_v6 --report work/validation-host-resources.json
    - name: Publish actual validation worker resources before long work
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v6-worker-validation-${{ github.run_id }}
        path: work/validation-host-resources.json
        if-no-files-found: warn
        compression-level: 6
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
      with:
        artifact-ids: ${{ steps.parent.outputs.shared_artifact_id }}
        merge-multiple: true
        run-id: ${{ steps.parent.outputs.parent_run_id }}
        github-token: ${{ github.token }}
        path: work/shared-input
      name: Download only the allowlisted original common publication
    - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
      with:
        artifact-ids: ${{ steps.parent.outputs.model_artifact_ids }}
        run-id: ${{ steps.parent.outputs.model_run_id }}
        github-token: ${{ github.token }}
        path: work/model-input
    - name: Capture fresh validation slot 0
      id: validate0
      run: python -m ebpf_discovery.qualification_replay_v6 validation --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256 "$V6_PARENT_SHA256"
        --root work --slot 0
    - name: Package lossless complete or partial validation capture 0
      id: validationpackage0
      if: ${{ always() && steps.validate0.outputs.collector != '' }}
      run: python -m ebpf_discovery.block_v6 package-capture --root work --capture-phase validation --slot 0
    - if: ${{ always() && steps.validationpackage0.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: v6-validation-${{ steps.validate0.outputs.collector }}-${{ github.run_id }}
        path: |-
          ${{ steps.validationpackage0.outputs.archive_path }}
          ${{ steps.validationpackage0.outputs.manifest_path }}
        if-no-files-found: warn
        include-hidden-files: true
        compression-level: 0
      name: Publish complete or partial validation slot 0
      id: validationupload0
    - name: Release verified validation working copy 0
      if: ${{ steps.validate0.outcome == 'success' && steps.validationupload0.outcome == 'success' }}
      run: python -m ebpf_discovery.block_v6 release --root work --capture-phase validation --slot 0 --artifact-id '${{ steps.validationupload0.outputs.artifact-id
        }}' --artifact-digest '${{ steps.validationupload0.outputs.artifact-digest }}'
    - name: Capture fresh validation slot 1
      id: validate1
      run: python -m ebpf_discovery.qualification_replay_v6 validation --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256 "$V6_PARENT_SHA256"
        --root work --slot 1
    - name: Package lossless complete or partial validation capture 1
      id: validationpackage1
      if: ${{ always() && steps.validate1.outputs.collector != '' }}
      run: python -m ebpf_discovery.block_v6 package-capture --root work --capture-phase validation --slot 1
    - if: ${{ always() && steps.validationpackage1.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: v6-validation-${{ steps.validate1.outputs.collector }}-${{ github.run_id }}
        path: |-
          ${{ steps.validationpackage1.outputs.archive_path }}
          ${{ steps.validationpackage1.outputs.manifest_path }}
        if-no-files-found: warn
        include-hidden-files: true
        compression-level: 0
      name: Publish complete or partial validation slot 1
      id: validationupload1
    - name: Release verified validation working copy 1
      if: ${{ steps.validate1.outcome == 'success' && steps.validationupload1.outcome == 'success' }}
      run: python -m ebpf_discovery.block_v6 release --root work --capture-phase validation --slot 1 --artifact-id '${{ steps.validationupload1.outputs.artifact-id
        }}' --artifact-digest '${{ steps.validationupload1.outputs.artifact-digest }}'
    - name: Capture fresh validation slot 2
      id: validate2
      run: python -m ebpf_discovery.qualification_replay_v6 validation --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256 "$V6_PARENT_SHA256"
        --root work --slot 2
    - name: Package lossless complete or partial validation capture 2
      id: validationpackage2
      if: ${{ always() && steps.validate2.outputs.collector != '' }}
      run: python -m ebpf_discovery.block_v6 package-capture --root work --capture-phase validation --slot 2
    - if: ${{ always() && steps.validationpackage2.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: v6-validation-${{ steps.validate2.outputs.collector }}-${{ github.run_id }}
        path: |-
          ${{ steps.validationpackage2.outputs.archive_path }}
          ${{ steps.validationpackage2.outputs.manifest_path }}
        if-no-files-found: warn
        include-hidden-files: true
        compression-level: 0
      name: Publish complete or partial validation slot 2
      id: validationupload2
    - name: Release verified validation working copy 2
      if: ${{ steps.validate2.outcome == 'success' && steps.validationupload2.outcome == 'success' }}
      run: python -m ebpf_discovery.block_v6 release --root work --capture-phase validation --slot 2 --artifact-id '${{ steps.validationupload2.outputs.artifact-id
        }}' --artifact-digest '${{ steps.validationupload2.outputs.artifact-digest }}'
    - name: Capture fresh validation slot 3
      id: validate3
      run: python -m ebpf_discovery.qualification_replay_v6 validation --operation "${{ inputs.operation }}" --parent-record "$V6_PARENT_RECORD" --parent-sha256 "$V6_PARENT_SHA256"
        --root work --slot 3
    - name: Package lossless complete or partial validation capture 3
      id: validationpackage3
      if: ${{ always() && steps.validate3.outputs.collector != '' }}
      run: python -m ebpf_discovery.block_v6 package-capture --root work --capture-phase validation --slot 3
    - if: ${{ always() && steps.validationpackage3.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: v6-validation-${{ steps.validate3.outputs.collector }}-${{ github.run_id }}
        path: |-
          ${{ steps.validationpackage3.outputs.archive_path }}
          ${{ steps.validationpackage3.outputs.manifest_path }}
        if-no-files-found: warn
        include-hidden-files: true
        compression-level: 0
      name: Publish complete or partial validation slot 3
      id: validationupload3
    - name: Release verified validation working copy 3
      if: ${{ steps.validate3.outcome == 'success' && steps.validationupload3.outcome == 'success' }}
      run: python -m ebpf_discovery.block_v6 release --root work --capture-phase validation --slot 3 --artifact-id '${{ steps.validationupload3.outputs.artifact-id
        }}' --artifact-digest '${{ steps.validationupload3.outputs.artifact-digest }}'
    - if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: v6-validation-summary-${{ github.run_id }}
        path: |-
          work/summaries/
          work/validation-host-resources.json
          work/block-plan.json
          work/block-validation-slot*-status.json
          work/block-all-forecasts-frozen.json
          work/block-disk-guards.jsonl
          work/block-vm-commands.jsonl
          work/validation-current-run-artifact-API.json
          work/publications/validation/
          work/vms/events/
          work/vms/history/
          work/vms/serial-log-access.jsonl
          work/block-controller-cost.jsonl
          work/shared-restored.json
          work/model-package-imports.json
          work/models/none/forecast-saved.json
          work/models/obi/forecast-saved.json
          work/models/coroot/forecast-saved.json
          work/models/deepflow/forecast-saved.json
          work/models/none/v6-training-publication-restored.json
          work/models/obi/v6-training-publication-restored.json
          work/models/coroot/v6-training-publication-restored.json
          work/models/deepflow/v6-training-publication-restored.json
          work/qualification-parent-block-plan.json
          work/qualification-replay-import.json
          work/qualification-verified-archive-release.json
          work/qualification-replay-cost.jsonl
          work/case/processing-publication-verification.json
          work/case/block-controller-cost.jsonl
          work/case/portable-model-write-guard.json
          work/inspection/
          work/parent-publication-API.json
        if-no-files-found: warn
        include-hidden-files: true
        compression-level: 6
    - name: Retain small continuation provenance and actual costs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: v6-qualification-replay-validation-provenance-${{ github.run_id }}
        path: |-
          work/inspection/
          work/qualification-inspection-report.json
          work/qualification-replay-cost.jsonl
          work/qualification-verified-archive-release.json
          work/case/processing-publication-verification.json
          work/case/block-controller-cost.jsonl
          work/case/portable-model-write-guard.json
          work/parent-publication-API.json
          work/block-disk-guards.jsonl
        if-no-files-found: warn
        compression-level: 6
