name: Review pending main saved evidence v5

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Run reviewed-family qualification first; pending17 requires its actual-output GO
        type: choice
        options:
          - qualification
          - pending17
          - fresh-qualification
          - fresh-series
        default: qualification
      qualification_system:
        description: Qualification-only family selector; pending17 requires all
        type: choice
        options:
          - all
          - otel_demo
          - deathstarbench
          - petclinic
        default: all
      candidate_manifest:
        description: Tracked docs JSON declaration; alternate manifests are pending-only
        type: string
        default: docs/iteration5-main-review-candidates.json
      pending17_after_qualification_go:
        description: Explicit confirmation that qualification output received independent GO
        type: boolean
        default: false
      fresh_series_after_qualification_go:
        description: Fresh 81-cell review requires independent actual-output qualification GO
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  declare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      candidate_manifest: ${{ steps.matrix.outputs.candidate_manifest }}
      candidate_manifest_sha256: ${{ steps.matrix.outputs.candidate_manifest_sha256 }}
      candidate_manifest_git_blob: ${{ steps.matrix.outputs.candidate_manifest_git_blob }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        env:
          PHASE: ${{ inputs.phase }}
          QUALIFICATION_SYSTEM: ${{ inputs.qualification_system }}
          CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
          PENDING17_GO: ${{ inputs.pending17_after_qualification_go }}
          FRESH_GO: ${{ inputs.fresh_series_after_qualification_go }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          default_manifest='docs/iteration5-main-review-candidates.json'
          manifest=os.environ['CANDIDATE_MANIFEST']
          path=pathlib.PurePosixPath(manifest)
          if (path.is_absolute() or path.as_posix()!=manifest or len(path.parts)!=2
                  or path.parts[0]!='docs' or path.suffix!='.json' or '..' in path.parts):
              raise SystemExit('candidate_manifest must be a normalized repo-relative docs/*.json path')
          subprocess.run(['git','ls-files','--error-unmatch','--',manifest],
                         check=True,stdout=subprocess.DEVNULL)
          body=pathlib.Path(manifest).read_bytes()
          source=json.loads(body)
          phase=os.environ['PHASE']
          qualification_system=os.environ['QUALIFICATION_SYSTEM']
          if phase=='qualification':
              if manifest!=default_manifest:
                  raise SystemExit('qualification requires the original candidate manifest')
              cells=source['qualification_cells']
              if qualification_system!='all':
                  cells=[row for row in cells if row['system']==qualification_system]
                  if len(cells)!=1:
                      raise SystemExit('qualification selector did not resolve exactly one declared cell')
          elif phase=='pending17':
              if qualification_system!='all':
                  raise SystemExit('qualification_system must be all for pending17')
              if os.environ['PENDING17_GO'].lower()!='true':
                  raise SystemExit('pending17 requires explicit post-qualification independent GO')
              cells=[row for row in source['cells']
                     if row['full_scope']!='reuse_existing_selected']
          elif phase in ('fresh-qualification','fresh-series'):
              if qualification_system!='all' or manifest==default_manifest:
                  raise SystemExit('fresh review requires its own manifest and all families')
              cells=source['cells']
              original=[('deepflow','deathstarbench','absent',6),
                        ('coroot','otel_demo','full',6),('obi','petclinic','partial',6)]
              keys=[(r['collector'],r['system'],r['mode'],r['seed']) for r in cells]
              if len(set(keys))!=len(keys):
                  raise SystemExit('fresh review contains duplicate cells')
              if phase=='fresh-qualification':
                  cells=[r for r in cells if (r['collector'],r['system'],r['mode'],r['seed']) in original]
                  if len(cells)!=3:
                      raise SystemExit('fresh qualification requires the three fixed main cells')
              else:
                  if os.environ.get('FRESH_GO','').lower()!='true':
                      raise SystemExit('fresh series requires independent actual-output qualification GO')
                  expected={(c,s,m,n) for c in ('obi','deepflow','coroot')
                            for s in ('deathstarbench','otel_demo','petclinic')
                            for m in ('absent','partial','full') for n in (6,7,8)}
                  if set(keys)!=expected:
                      raise SystemExit('fresh series must review all 81 cells')
              for cell in cells:
                  if (cell.get('head_sha')!='f60cbfe5e19ca88b40e196d8e793ef0e2aac5d5c'
                          or cell.get('stage')!='main' or cell.get('runner')!='study'
                          or cell.get('compact_scope')!='retrieve_selected_nonjournal'
                          or cell.get('full_scope')!='retrieve_family_selected'
                          or not {'full_artifact_id','full_artifact_name','full_artifact_bytes',
                                  'full_artifact_digest'}<=cell.keys()):
                      raise SystemExit('fresh review requires exact main source and both full/compact packets')
          else:
              raise SystemExit('unknown review phase')
          required={'collector','system','mode','seed','run_id','head_sha',
                    'compact_artifact_id','compact_artifact_name','compact_artifact_bytes',
                    'compact_artifact_digest','compact_scope','full_scope'}
          compact_scopes={'retrieve_selected_nonjournal','reuse_existing_verified_facts'}
          full_scopes={'retrieve_family_selected','retrieve_input_supplement'}
          if not cells:
              raise SystemExit('candidate manifest selected no review cells')
          for cell in cells:
              if (not isinstance(cell,dict) or not required<=cell.keys()
                      or cell['compact_scope'] not in compact_scopes
                      or cell['full_scope'] not in full_scopes):
                  raise SystemExit('candidate manifest has a malformed cell or invalid scope')
          digest=hashlib.sha256(body).hexdigest()
          git_blob=subprocess.check_output(['git','hash-object','--',manifest],text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('matrix='+json.dumps({'cell':cells},separators=(',',':'))+'\n')
              out.write('candidate_manifest='+manifest+'\n')
              out.write('candidate_manifest_sha256='+digest+'\n')
              out.write('candidate_manifest_git_blob='+git_blob+'\n')
          PY

  review:
    needs: declare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.declare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evidence-transport dependency
        run: python -m pip install -e . opentelemetry-proto
      - name: Resolve exact declared artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CELL_JSON: ${{ toJson(matrix.cell) }}
          CANDIDATE_MANIFEST: ${{ needs.declare.outputs.candidate_manifest }}
          CANDIDATE_MANIFEST_SHA256: ${{ needs.declare.outputs.candidate_manifest_sha256 }}
          CANDIDATE_MANIFEST_GIT_BLOB: ${{ needs.declare.outputs.candidate_manifest_git_blob }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          cell=json.loads(os.environ['CELL_JSON'])
          raw=subprocess.check_output(['gh','api','--paginate','--slurp',
              f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{cell['run_id']}/artifacts"])
          pages=json.loads(raw); artifacts=[row for page in pages for row in page['artifacts']]
          compact=[row for row in artifacts if row['name']==cell['compact_artifact_name']]
          full_name=cell['compact_artifact_name'].replace('v5-summary-','campaign-v5-',1)
          full=[row for row in artifacts if row['name']==full_name]
          if len(compact)!=1 or len(full)!=1:
              raise SystemExit(f"ambiguous/missing declared artifacts: compact={len(compact)} full={len(full)}")
          c=compact[0]
          expected_compact={
              'id':cell['compact_artifact_id'],'name':cell['compact_artifact_name'],
              'size_in_bytes':cell['compact_artifact_bytes'],'digest':cell['compact_artifact_digest'],
              'run_id':cell['run_id'],'head_sha':cell['head_sha']}
          if {k:c.get(k) for k in ('id','name','size_in_bytes','digest')} != {
                  k:expected_compact[k] for k in ('id','name','size_in_bytes','digest')}:
              raise SystemExit('compact API identity differs from fixed declaration')
          f=full[0]
          expected_full={k:f[k] for k in ('id','name','size_in_bytes','digest')}
          if 'full_artifact_id' in cell:
              declared_full={
                  'id':cell['full_artifact_id'],'name':cell['full_artifact_name'],
                  'size_in_bytes':cell['full_artifact_bytes'],
                  'digest':cell['full_artifact_digest']}
              if expected_full != declared_full:
                  raise SystemExit('full API identity differs from fixed qualification declaration')
          expected_full.update(run_id=cell['run_id'],head_sha=cell['head_sha'])
          pathlib.Path('work/review').mkdir(parents=True)
          pathlib.Path('work/review/declaration.json').write_text(json.dumps(cell,indent=2)+'\n')
          pathlib.Path('work/review/expected-compact.json').write_text(json.dumps(expected_compact,indent=2)+'\n')
          pathlib.Path('work/review/expected-full.json').write_text(json.dumps(expected_full,indent=2)+'\n')
          pathlib.Path('work/review/resolved-api.json').write_text(json.dumps({
              'repository':os.environ['GITHUB_REPOSITORY'],'run_id':cell['run_id'],
              'head_sha':cell['head_sha'],'compact':c,'full':f},indent=2)+'\n')
          pathlib.Path('work/review/candidate-manifest.json').write_text(json.dumps({
              'path':os.environ['CANDIDATE_MANIFEST'],
              'sha256':os.environ['CANDIDATE_MANIFEST_SHA256'],
              'git_blob':os.environ['CANDIDATE_MANIFEST_GIT_BLOB'],
              'workflow_head_sha':os.environ['GITHUB_SHA']},indent=2)+'\n')
          PY
      - name: Retrieve only missing selected evidence
        env:
          GH_TOKEN: ${{ github.token }}
          COMPACT_SCOPE: ${{ matrix.cell.compact_scope }}
          FULL_SCOPE: ${{ matrix.cell.full_scope }}
        run: |
          if [ "$COMPACT_SCOPE" = "retrieve_selected_nonjournal" ]; then
            python scripts/select-main-review-evidence-v5.py \
              --artifact '${{ matrix.cell.compact_artifact_id }}' \
              --expected work/review/expected-compact.json --scope compact \
              --out work/review/compact
          fi
          FULL_ID=$(python -c "import json;print(json.load(open('work/review/expected-full.json'))['id'])")
          if [ "$FULL_SCOPE" = "retrieve_input_supplement" ]; then
            python scripts/select-main-review-evidence-v5.py \
              --artifact "$FULL_ID" --expected work/review/expected-full.json \
              --scope input-supplement --out work/review/full
          else
            python scripts/select-main-review-evidence-v5.py \
              --artifact "$FULL_ID" --expected work/review/expected-full.json \
              --scope full --out work/review/full
          fi
      - name: Verify saved facts where the family packet is present
        if: matrix.cell.full_scope == 'retrieve_family_selected'
        env:
          COMPACT_SCOPE: ${{ matrix.cell.compact_scope }}
        run: |
          if [ "$COMPACT_SCOPE" = "retrieve_selected_nonjournal" ]; then
            python scripts/review-main-saved-facts-v5.py \
              --declaration work/review/declaration.json --compact work/review/compact \
              --full work/review/full --out work/review/facts
          else
            python scripts/review-main-saved-facts-v5.py \
              --declaration work/review/declaration.json \
              --full work/review/full --out work/review/facts
          fi
      - name: Remove verified typed-package working bodies
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          facts_path=pathlib.Path('work/review/facts/saved-evidence-facts.json')
          package_domains={}
          if facts_path.is_file():
              facts=json.loads(facts_path.read_text())
              claims=((facts.get('full_facts') or {}).get('typed_packages') or {})
              package_domains={domain for domain,value in claims.items()
                  if value.get('all_files_verified',0)>0
                  and value.get('archive_sha256') and value.get('manifest_sha256')}
          removed=[]
          for domain,name in (
                  ('toolchain','work/review/full/toolchain-package/payload.tar.gz'),
                  ('handoff','work/review/full/infrastructure/handoff-package/payload.tar.gz')):
              path=pathlib.Path(name)
              if path.is_file():
                  with path.open('rb') as stream:
                      digest=hashlib.file_digest(stream,'sha256').hexdigest()
                  removed.append({'path':name,'bytes':path.stat().st_size,
                      'sha256':digest,
                      'disposition':(
                          'verified_working_copy_removed_before_upload'
                          if domain in package_domains
                          else 'unverified_or_incomplete_working_copy_removed_before_upload'),
                      'source_artifact_remains_retained':True})
                  path.unlink()
          pathlib.Path('work/review/working-copy-disposition.json').write_text(
              json.dumps(removed,indent=2)+'\n')
          PY
      - name: Upload bounded evidence facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-review-evidence-${{ matrix.cell.collector }}-${{ matrix.cell.system }}-${{ matrix.cell.mode }}-${{ matrix.cell.seed }}-${{ matrix.cell.run_id }}
          path: work/review
          if-no-files-found: error
          retention-days: 90
