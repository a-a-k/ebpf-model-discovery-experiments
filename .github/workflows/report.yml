name: Regenerate empirical tables and figures
on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: Space-separated campaign run IDs; retain failed attempts too
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . matplotlib
      - name: Download retained campaign artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          for run_id in $RUN_IDS; do
            [[ "$run_id" =~ ^[0-9]+$ ]] || exit 2
            gh run download "$run_id" --pattern 'campaign-*' -D "work/inputs/$run_id"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/jobs?per_page=100" > "work/inputs/$run_id/jobs.json"
          done
      - run: python -m ebpf_discovery.report --inputs work/inputs --out results/report
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: results/report/
          retention-days: 90
