name: Closed worker import equality qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing import verifier
        run: python -m pip install -e . opentelemetry-proto
      - name: Free unused hosted SDK disk for the fixed retained artifact
        run: |
          mkdir -p results/closed-discovery-import
          df -B1 . > results/closed-discovery-import/host-disk-before.txt
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -B1 . > results/closed-discovery-import/host-disk-after.txt
      - name: Compare original and linked import of the exact closed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/qualify-closed-discovery-import-v5.py
      - name: Retain host status after either outcome
        if: always()
        run: |
          mkdir -p results/closed-discovery-import
          df -B1 . > results/closed-discovery-import/host-disk-final.txt
          free -b > results/closed-discovery-import/host-memory-final.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closed-discovery-import-${{ github.run_id }}
          path: results/closed-discovery-import
          retention-days: 90
