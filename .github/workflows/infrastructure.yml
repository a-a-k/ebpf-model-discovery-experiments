name: Fixed original absent8 exact export reference comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest opentelemetry-proto
      - name: Free only the existing unused hosted SDK directories
        run: |
          mkdir -p work/projection-reference-host
          df -B1 . > work/projection-reference-host/disk-before.txt
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -B1 . > work/projection-reference-host/disk-after.txt
      - name: Compare exact original exported requests and full value references
        run: python scripts/validate-exact-projection-export-references-v5.py
      - name: Retain exact request equality and complete preparation costs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-projection-reference-${{ github.run_id }}
          path: |
            work/projection-reference-qualification/
            work/projection-reference-host/
          if-no-files-found: error
          retention-days: 90
