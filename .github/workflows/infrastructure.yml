name: Two-guest infrastructure qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install experiment tools
        run: python -m pip install -e . opentelemetry-proto
      - name: Start two independent guest kernels
        run: bash scripts/vms.sh start work/vms
      - name: Preserve infrastructure evidence
        if: always()
        run: |
          mkdir -p results/infrastructure
          cp work/vms/*.json results/infrastructure/ 2>/dev/null || true
          for n in a b; do
            mkdir -p results/infrastructure/$n
            cp work/vms/$n/check.txt work/vms/$n/serial.log results/infrastructure/$n/ 2>/dev/null || true
          done
          uname -a > results/infrastructure/runner.txt
          free -m >> results/infrastructure/runner.txt
          df -h >> results/infrastructure/runner.txt
      - name: Stop guests
        if: always()
        run: bash scripts/vms.sh stop work/vms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-${{ github.run_id }}
          path: results/infrastructure
          retention-days: 90
