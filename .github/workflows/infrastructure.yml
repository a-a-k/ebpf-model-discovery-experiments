name: Fixed original absent8 consistent SQLite proof comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest opentelemetry-proto
      - name: Free only the existing unused hosted SDK directories
        run: |
          mkdir -p work/sql-proof-reuse-host
          df -B1 . > work/sql-proof-reuse-host/disk-before.txt
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -B1 . > work/sql-proof-reuse-host/disk-after.txt
      - name: Compare the exact original saved SQLite proofs and measured costs
        run: python scripts/validate-exact-sql-backup-proof-reuse-v5.py
      - name: Retain exact proof equality and phase costs after either outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-sql-proof-reuse-${{ github.run_id }}
          path: |
            work/sql-proof-reuse-qualification/
            work/sql-proof-reuse-host/
          if-no-files-found: error
          retention-days: 90
