name: Fixed original absent8 shared scope export comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest opentelemetry-proto
      - name: Free only the existing unused hosted SDK directories
        run: |
          mkdir -p work/shared-scope-host
          df -B1 . > work/shared-scope-host/disk-before.txt
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -B1 . > work/shared-scope-host/disk-after.txt
      - name: Compare all original requests and metadata using the validated raw scope composition
        run: python scripts/validate-shared-deepflow-scope-export-v5.py
      - name: Retain exact request equality and complete preparation costs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-shared-scope-${{ github.run_id }}
          path: |
            work/shared-scope-qualification/
            work/shared-scope-host/
          if-no-files-found: error
          retention-days: 90
