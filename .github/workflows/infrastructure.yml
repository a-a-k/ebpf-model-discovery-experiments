name: Recover the saved closed OTel absent7 capture
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    name: Recover the saved closed OTel absent7 capture
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: src:.
      GH_TOKEN: ${{ github.token }}
      CAPTURE_ARTIFACT_ID: '13315023235'
      CAPTURE_ARTIFACT_DIGEST: 'c91fafafbfaf8a752a19083c882ae29552fb46c5eb916822fbce9568a3683169'
      CAPTURE_FILE_BYTES: '63496892082'
      CAPTURE_PROOF_BYTES: '20434899'
      CAPTURE_INDEX_BYTES: '14854103040'
      CAPTURE_MANIFEST_SHA256: '2bc2601e7c2db4e69e3671fbf83b03c1994730f17466d45defe924ebb0e28aea'
      CAPTURE_MODE: 'absent'
      CAPTURE_SEED: '7'
      CAPTURE_ARCHIVE_BYTES: '5725603997'
      SCIENTIFIC_CAPTURE_RUN_ID: '41781475751'
      SCIENTIFIC_CAPTURE_SOURCE: '8166f7d5ed3ef1e5c505cd22aea6745d5ad81070'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the unchanged scientific processing dependencies
        run: python -m pip install -e . opentelemetry-proto
      - name: Free unused hosted SDK copies before restoring the closed capture
        run: |
          mkdir -p work/offline-host
          df -B1 . > work/offline-host/host-disk-before.txt
          python - <<'PY'
          import json,pathlib,shutil,subprocess,sys,time
          out=pathlib.Path('work/offline-host')
          protected=[pathlib.Path.cwd().resolve(),pathlib.Path(sys.executable).resolve()]
          for tool in ('gh','git','node'):
              binary=shutil.which(tool)
              if binary: protected.append(pathlib.Path(binary).resolve())
          paths=['/usr/local/lib/android','/usr/share/dotnet','/opt/ghc',
                 '/usr/local/.ghcup','/usr/share/swift','/usr/lib/jvm',
                 '/opt/hostedtoolcache/CodeQL','/opt/hostedtoolcache/go',
                 '/opt/hostedtoolcache/Ruby','/opt/az','/opt/google',
                 '/opt/microsoft','/usr/local/share/powershell','/usr/local/share/boost']
          proof={'scope':'Offline postcapture unused hosted SDK/images; no scientific payload deletion',
                 'started_ns':time.time_ns(),'free_before':shutil.disk_usage('.').free,
                 'protected_runtime_paths':[str(p) for p in protected],'paths':[],'docker_cleanup':[]}
          for name in paths:
              path=pathlib.Path(name)
              assert not any(p.is_relative_to(path.resolve()) for p in protected)
              before=shutil.disk_usage('.').free
              size=subprocess.run(['sudo','du','-sx','-B1','--',name],capture_output=True,text=True)
              subprocess.run(['sudo','rm','-rf','--',name],check=True)
              proof['paths'].append({'path':name,'du_returncode':size.returncode,'du_stdout':size.stdout,
                                     'du_stderr':size.stderr,'free_before':before,'free_after':shutil.disk_usage('.').free})
              (out/'diagnostic-sdk-cleanup.json').write_text(json.dumps(proof,indent=2)+'\n')
          for command in (['sudo','docker','image','prune','--all','--force'],
                          ['sudo','docker','builder','prune','--all','--force']):
              result=subprocess.run(command,capture_output=True,text=True)
              proof['docker_cleanup'].append({'command':command,'returncode':result.returncode,
                                              'stdout':result.stdout,'stderr':result.stderr})
          proof.update(ended_ns=time.time_ns(),free_after=shutil.disk_usage('.').free)
          (out/'diagnostic-sdk-cleanup.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps({'free_before':proof['free_before'],'free_after':proof['free_after'],
                            'scope':proof['scope']}))
          PY
          df -B1 . > work/offline-host/host-disk-after.txt
          python scripts/control-closed-offline-resources-v5.py prepare
      - name: Restore the exact closed capture after the actual disk guard
        run: python scripts/restore-closed-postcapture-v5.py --capture-run-id 41781475751 --capture-source 8166f7d5ed3ef1e5c505cd22aea6745d5ad81070 --release-verified-delivery
      - name: Verify all closed inputs and run the unchanged offline suffix
        run: python scripts/control-closed-offline-resources-v5.py run
      - name: Retain offline host and restore costs after either outcome
        if: always()
        run: |
          mkdir -p work/offline-host
          df -B1 . > work/offline-host/disk-final.txt
          free -b > work/offline-host/memory-final.txt
          sudo dmesg --ctime > work/offline-host/kernel-final.txt 2> work/offline-host/kernel-final.err || true
          python -m pip freeze > work/offline-host/python-environment.txt
          if [[ -d work/campaign ]]; then
            mkdir -p work/campaign/infrastructure/postcapture-host
            cp -a work/offline-host/. work/campaign/infrastructure/postcapture-host/
          fi
      - name: Evaluate retained full campaign evidence
        if: success()
        env:
          PYTHONPATH: src
        run: |
          python -m ebpf_discovery.evaluate_v5 --campaign work/campaign \
            --out work/campaign/evaluation-v5.json
      - name: Record compact evaluation provenance
        if: success()
        env:
          PYTHONPATH: src
        run: |
          python -m ebpf_discovery.summary_manifest_v5 --campaign work/campaign \
            --system 'otel_demo' --mode 'absent' --seed '7' \
            --collector 'deepflow' --stage 'main'
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('work/campaign')
          status=json.loads((root/'status.json').read_text())
          path=root/'evaluation-manifest.json'
          manifest=json.loads(path.read_text())
          manifest['scientific_capture_identity']={key:status[key] for key in
              ('run_id','commit','system','collector','mode','seed')}
          manifest['closed_capture_recovery']={
              'capture_run_id':'41781475751','capture_source':'8166f7d5ed3ef1e5c505cd22aea6745d5ad81070',
              'capture_artifact_id':13315023235,
              'capture_artifact_digest':'sha256:'+os.environ['CAPTURE_ARTIFACT_DIGEST'],
              'processing_run_id':os.environ['GITHUB_RUN_ID'],'processing_source':os.environ['GITHUB_SHA'],
              'new_application_traffic':False,'refit_models':False}
          assert status['run_id']=='41781475751' and status['commit']=='8166f7d5ed3ef1e5c505cd22aea6745d5ad81070'
          path.write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v5-summary-deepflow-main-otel_demo-absent-7-${{ github.run_id }}
          path: |
            work/campaign/evaluation-v5.json
            work/campaign/evaluation-manifest.json
            work/campaign/status.json
            work/campaign/plans.json
            work/campaign/census.json
            work/campaign/blocks.json
            work/campaign/freeze-integrity.json
            work/campaign/toolchain/forecasts.json
            work/campaign/evidence-v4.json
            work/campaign/attempt-journal.jsonl
            work/campaign/classes-v5.json
            work/campaign/classes-v4.json
            work/campaign/observations/collector.json
            work/campaign/observations/drain-evidence.json
            work/campaign/observations/technical-positive-control.json
            work/campaign/observations/control-prestart*.json
            work/campaign/observations/startup-*.json
            work/campaign/observations/startup-*.log
            work/campaign/observations/readiness.json
            work/campaign/observations/receiver-*.log
            work/campaign/observations/pre-drain-*-logs.log
            work/campaign/observations/final-*-collector.log
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: campaign-v5-deepflow-main-otel_demo-absent-7-${{ github.run_id }}
          path: |
            work/campaign/
            !work/campaign/**/source/**
            !work/campaign/**/upstream/**
            !work/campaign/**/image-context/**
            !work/campaign/**/petclinic-image.tar
            !work/campaign/toolchain-build/checkouts/**
            !work/campaign/toolchain-build/go/**
          compression-level: 1
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Retain the compact postcapture processing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postcapture-processing-absent-7-${{ github.run_id }}
          path: work/offline-host/
          retention-days: 90
          if-no-files-found: warn
