name: Fixed closed OTel whole-suffix qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: src:.
      GH_TOKEN: ${{ github.token }}
    outputs:
      file_bytes: ${{ steps.build.outputs.file_bytes }}
      proof_bytes: ${{ steps.build.outputs.proof_bytes }}
      index_bytes: ${{ steps.build.outputs.index_bytes }}
      manifest_sha256: ${{ steps.build.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.capture_upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.capture_upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the unchanged scientific processing dependencies
        run: python -m pip install -e . opentelemetry-proto
      - name: Verify scientific declaration imports before restoring artifacts
        run: python -P -c "import systems.otel_demo.experiment_v4; import ebpf_discovery.postcapture_v5"
      - name: Free unused hosted SDK copies before restoring the closed capture
        run: |
          mkdir -p work/offline-host
          df -B1 . > work/offline-host/host-disk-before.txt
          python - <<'PY'
          import json,pathlib,shutil,subprocess,sys,time
          out=pathlib.Path('work/offline-host')
          protected=[pathlib.Path.cwd().resolve(),pathlib.Path(sys.executable).resolve()]
          for tool in ('gh','git','node'):
              binary=shutil.which(tool)
              if binary: protected.append(pathlib.Path(binary).resolve())
          paths=['/usr/local/lib/android','/usr/share/dotnet','/opt/ghc',
                 '/usr/local/.ghcup','/usr/share/swift','/usr/lib/jvm',
                 '/opt/hostedtoolcache/CodeQL','/opt/hostedtoolcache/go',
                 '/opt/hostedtoolcache/Ruby','/opt/az','/opt/google',
                 '/opt/microsoft','/usr/local/share/powershell','/usr/local/share/boost']
          proof={'scope':'Offline postcapture unused hosted SDK/images; no scientific payload deletion',
                 'started_ns':time.time_ns(),'free_before':shutil.disk_usage('.').free,
                 'protected_runtime_paths':[str(p) for p in protected],'paths':[],'docker_cleanup':[]}
          for name in paths:
              path=pathlib.Path(name)
              assert not any(p.is_relative_to(path.resolve()) for p in protected)
              before=shutil.disk_usage('.').free
              size=subprocess.run(['sudo','du','-sx','-B1','--',name],capture_output=True,text=True)
              subprocess.run(['sudo','rm','-rf','--',name],check=True)
              proof['paths'].append({'path':name,'du_returncode':size.returncode,'du_stdout':size.stdout,
                                     'du_stderr':size.stderr,'free_before':before,'free_after':shutil.disk_usage('.').free})
              (out/'diagnostic-sdk-cleanup.json').write_text(json.dumps(proof,indent=2)+'\n')
          for command in (['sudo','docker','image','prune','--all','--force'],
                          ['sudo','docker','builder','prune','--all','--force']):
              result=subprocess.run(command,capture_output=True,text=True)
              proof['docker_cleanup'].append({'command':command,'returncode':result.returncode,
                                              'stdout':result.stdout,'stderr':result.stderr})
          proof.update(ended_ns=time.time_ns(),free_after=shutil.disk_usage('.').free)
          (out/'diagnostic-sdk-cleanup.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps({'free_before':proof['free_before'],'free_after':proof['free_after'],
                            'scope':proof['scope']}))
          PY
          df -B1 . > work/offline-host/host-disk-after.txt
      - name: Reconstruct the complete saved full6 capture and seal all scientific inputs
        id: build
        run: python scripts/qualify-closed-postcapture-v5.py build
      - name: Publish the complete lossless closed capture using the production layout
        id: capture_upload
        uses: actions/upload-artifact@v4
        with:
          name: qualification-closed-postcapture-${{ github.run_id }}
          path: |
            work/campaign/
            work/postcapture-proof/
            !work/campaign/**/source/**
            !work/campaign/**/upstream/**
            !work/campaign/**/image-context/**
            !work/campaign/**/petclinic-image.tar
            !work/campaign/toolchain-build/checkouts/**
            !work/campaign/toolchain-build/go/**
          compression-level: 1
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Retain phase host status and costs
        if: always()
        run: |
          mkdir -p results/closed-postcapture-qualification/host
          cp -a work/offline-host/. results/closed-postcapture-qualification/host/
          df -B1 . > results/closed-postcapture-qualification/host/disk-final.txt
          free -b > results/closed-postcapture-qualification/host/memory-final.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closed-postcapture-build-${{ github.run_id }}
          path: results/closed-postcapture-qualification/
          retention-days: 90
          if-no-files-found: warn
  compare:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONPATH: src:.
      GH_TOKEN: ${{ github.token }}
      CAPTURE_ARTIFACT_ID: ${{ needs.prepare.outputs.artifact_id }}
      CAPTURE_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.artifact_digest }}
      CAPTURE_FILE_BYTES: ${{ needs.prepare.outputs.file_bytes }}
      CAPTURE_PROOF_BYTES: ${{ needs.prepare.outputs.proof_bytes }}
      CAPTURE_INDEX_BYTES: ${{ needs.prepare.outputs.index_bytes }}
      CAPTURE_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
      CAPTURE_MODE: full
      CAPTURE_SEED: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the unchanged scientific processing dependencies
        run: python -m pip install -e . opentelemetry-proto
      - name: Verify scientific declaration imports before restoring artifacts
        run: python -P -c "import systems.otel_demo.experiment_v4; import ebpf_discovery.postcapture_v5"
      - name: Free unused hosted SDK copies before restoring the closed capture
        run: |
          mkdir -p work/offline-host
          df -B1 . > work/offline-host/host-disk-before.txt
          python - <<'PY'
          import json,pathlib,shutil,subprocess,sys,time
          out=pathlib.Path('work/offline-host')
          protected=[pathlib.Path.cwd().resolve(),pathlib.Path(sys.executable).resolve()]
          for tool in ('gh','git','node'):
              binary=shutil.which(tool)
              if binary: protected.append(pathlib.Path(binary).resolve())
          paths=['/usr/local/lib/android','/usr/share/dotnet','/opt/ghc',
                 '/usr/local/.ghcup','/usr/share/swift','/usr/lib/jvm',
                 '/opt/hostedtoolcache/CodeQL','/opt/hostedtoolcache/go',
                 '/opt/hostedtoolcache/Ruby','/opt/az','/opt/google',
                 '/opt/microsoft','/usr/local/share/powershell','/usr/local/share/boost']
          proof={'scope':'Offline postcapture unused hosted SDK/images; no scientific payload deletion',
                 'started_ns':time.time_ns(),'free_before':shutil.disk_usage('.').free,
                 'protected_runtime_paths':[str(p) for p in protected],'paths':[],'docker_cleanup':[]}
          for name in paths:
              path=pathlib.Path(name)
              assert not any(p.is_relative_to(path.resolve()) for p in protected)
              before=shutil.disk_usage('.').free
              size=subprocess.run(['sudo','du','-sx','-B1','--',name],capture_output=True,text=True)
              subprocess.run(['sudo','rm','-rf','--',name],check=True)
              proof['paths'].append({'path':name,'du_returncode':size.returncode,'du_stdout':size.stdout,
                                     'du_stderr':size.stderr,'free_before':before,'free_after':shutil.disk_usage('.').free})
              (out/'diagnostic-sdk-cleanup.json').write_text(json.dumps(proof,indent=2)+'\n')
          for command in (['sudo','docker','image','prune','--all','--force'],
                          ['sudo','docker','builder','prune','--all','--force']):
              result=subprocess.run(command,capture_output=True,text=True)
              proof['docker_cleanup'].append({'command':command,'returncode':result.returncode,
                                              'stdout':result.stdout,'stderr':result.stderr})
          proof.update(ended_ns=time.time_ns(),free_after=shutil.disk_usage('.').free)
          (out/'diagnostic-sdk-cleanup.json').write_text(json.dumps(proof,indent=2)+'\n')
          print(json.dumps({'free_before':proof['free_before'],'free_after':proof['free_after'],
                            'scope':proof['scope']}))
          PY
          df -B1 . > work/offline-host/host-disk-after.txt
      - name: Restore the actual published closed capture through the production transport
        run: python scripts/restore-closed-postcapture-v5.py
      - name: Verify all closed inputs and execute the complete unchanged offline suffix
        run: |
          python -m ebpf_discovery.postcapture_v5 finalize --campaign work/campaign             --proof work/restored-postcapture/postcapture-proof             --capture-run-id 41470575905 --capture-source 0056b4c8ecb85e8b40c433e63af442133a21f3cc
      - name: Compare every final SQL row and all scientific outputs against the original full6 case
        run: python scripts/qualify-closed-postcapture-v5.py compare
      - name: Retain phase host status and costs
        if: always()
        run: |
          mkdir -p results/closed-postcapture-qualification/host
          cp -a work/offline-host/. results/closed-postcapture-qualification/host/
          df -B1 . > results/closed-postcapture-qualification/host/disk-final.txt
          free -b > results/closed-postcapture-qualification/host/memory-final.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-v5-summary-deepflow-main-otel_demo-full-6-${{ github.run_id }}
          path: |
            work/campaign/evaluation-v5.json
            work/campaign/evaluation-manifest.json
            work/campaign/status.json
            work/campaign/plans.json
            work/campaign/census.json
            work/campaign/blocks.json
            work/campaign/freeze-integrity.json
            work/campaign/toolchain/forecasts.json
            work/campaign/evidence-v4.json
            work/campaign/attempt-journal.jsonl
            work/campaign/classes-v5.json
            work/campaign/classes-v4.json
            work/campaign/observations/collector.json
            work/campaign/observations/drain-evidence.json
            work/campaign/observations/technical-positive-control.json
            work/campaign/observations/control-prestart*.json
            work/campaign/observations/startup-*.json
            work/campaign/observations/startup-*.log
            work/campaign/observations/readiness.json
            work/campaign/observations/receiver-*.log
            work/campaign/observations/pre-drain-*-logs.log
            work/campaign/observations/final-*-collector.log
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification-campaign-v5-deepflow-main-otel_demo-full-6-${{ github.run_id }}
          path: |
            work/campaign/
            !work/campaign/**/source/**
            !work/campaign/**/upstream/**
            !work/campaign/**/image-context/**
            !work/campaign/**/petclinic-image.tar
            !work/campaign/toolchain-build/checkouts/**
            !work/campaign/toolchain-build/go/**
          compression-level: 1
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closed-postcapture-compare-${{ github.run_id }}
          path: |
            results/closed-postcapture-qualification/
            work/offline-host/
          retention-days: 90
          if-no-files-found: warn
