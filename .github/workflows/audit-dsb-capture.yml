name: Audit fixed saved capture facts
on:
  workflow_dispatch:
    inputs:
      audit:
        type: choice
        options: [dsb-capture, entry-route-binding, otlp-attribute-keys]
        default: dsb-capture
      declaration:
        description: Optional tracked fixed artifact declaration; otherwise use the selected audit's original source
        type: string
        default: ''
      collector:
        description: Collectors declared by the selected fixed source
        type: choice
        options: [all, obi, deepflow, coroot]
        default: all
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        collector: ${{ fromJson(inputs.collector == 'obi' && '["obi"]' || inputs.collector == 'deepflow' && '["deepflow"]' || inputs.collector == 'coroot' && '["coroot"]' || '["obi","deepflow","coroot"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . opentelemetry-proto
      - name: Retrieve fixed immutable source captures
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECTOR: ${{ matrix.collector }}
          AUDIT_KIND: ${{ inputs.audit }}
          DECLARATION: ${{ inputs.declaration }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path('work/dsb-audit-input'); root.mkdir(parents=True)
          kind=os.environ['AUDIT_KIND']
          defaults={'dsb-capture':'docs/dsb-capture-audit-20261030.json',
                    'entry-route-binding':'docs/entry-route-binding-audit-20261030.json',
                    'otlp-attribute-keys':'docs/otel-attribute-key-audit-20261030.json'}
          declaration=os.environ['DECLARATION'] or defaults[kind]
          path=pathlib.PurePosixPath(declaration)
          if (path.is_absolute() or path.as_posix()!=declaration or len(path.parts)!=2
                  or path.parts[0]!='docs' or path.suffix!='.json' or '..' in path.parts):
              raise SystemExit('declaration must be a normalized tracked docs/*.json')
          subprocess.run(['git','ls-files','--error-unmatch','--',declaration],check=True,
                         stdout=subprocess.DEVNULL)
          cells=json.loads(pathlib.Path(declaration).read_text())['cells']
          cell=next(row for row in cells if row['collector']==os.environ['COLLECTOR'])
          (root/'cell.json').write_text(json.dumps(cell,indent=2)+'\n')
          for role in ('full','compact'):
              endpoint=f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{cell[role]['id']}"
              with (root/(role+'-api.json')).open('wb') as stream:
                  subprocess.run(['gh','api',endpoint],stdout=stream,check=True)
              with (root/(role+'.zip')).open('wb') as stream:
                  subprocess.run(['gh','api',endpoint+'/zip'],stdout=stream,check=True)
          if kind=='entry-route-binding':
              with (root/'old-binding-api.json').open('wb') as stream:
                  subprocess.run(['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/contents/src/ebpf_discovery/binding_v5.py?ref={cell['head_sha']}"],stdout=stream,check=True)
          PY
      - name: Inspect complete prefixes and retained rejection evidence
        env:
          PYTHONPATH: src:.
          AUDIT_SCRIPT: ${{ inputs.audit == 'entry-route-binding' && 'audit-entry-route-binding.py' || inputs.audit == 'otlp-attribute-keys' && 'audit-otlp-attribute-keys.py' || 'audit-dsb-capture.py' }}
        run: |
          python "scripts/$AUDIT_SCRIPT" --source work/dsb-audit-input \
            --cell work/dsb-audit-input/cell.json --out work/dsb-audit/facts.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.audit == 'entry-route-binding' && 'entry-route-binding-audit' || inputs.audit == 'otlp-attribute-keys' && 'otlp-attribute-key-audit' || 'dsb-capture-audit' }}-${{ matrix.collector }}-${{ github.run_id }}
          path: |
            work/dsb-audit-input/cell.json
            work/dsb-audit-input/*-api.json
            work/dsb-audit/facts.json
            work/dsb-audit/selected/
          retention-days: 90
          if-no-files-found: error
