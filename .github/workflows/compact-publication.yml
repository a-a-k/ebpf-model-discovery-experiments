name: Build the compact publication package
on:
  workflow_dispatch:
    inputs:
      include_example:
        description: Include the selected OTel absent-OBI training and frozen-model example
        type: boolean
        default: true
  push:
    branches: [publication/minimal-reproduction-20261111]
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: src:.
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest opentelemetry-proto
      - name: Check bounded selection and packaging with synthetic inputs
        run: python -m pytest --import-mode=importlib tests/test_compact_publication.py
      - name: Build only the pinned publication inputs
        env:
          INCLUDE_EXAMPLE: ${{ github.event_name == 'push' || inputs.include_example }}
        run: |
          extra=()
          if [ "$INCLUDE_EXAMPLE" = true ]; then extra+=(--include-example); fi
          python -m ebpf_discovery.compact_publication build --out work/compact-publication "${extra[@]}"
      - name: Verify the packaged analytical data in isolation
        run: python -m ebpf_discovery.compact_publication verify --archive work/compact-publication/code-and-results.zip
      - name: Upload the bounded Zenodo-ready files
        uses: actions/upload-artifact@v4
        with:
          name: compact-publication-${{ github.run_id }}
          path: work/compact-publication/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
