name: Iteration 4 exact remote toolchain worker
on:
  workflow_dispatch:
    inputs:
      request_id: {required: true, type: string}
      parent_repository: {required: true, type: string}
      run_id: {required: true, type: string}
      parent_run_attempt: {required: true, type: string}
      parent_cell_id: {required: true, type: string}
      commit: {required: true, type: string}
      system: {required: true, type: string}
      mode: {required: true, type: string}
      seed: {required: true, type: string}
      manifest_sha256: {required: true, type: string}
      artifact_id: {required: true, type: string}
      artifact_url: {required: true, type: string}
      artifact_digest: {required: true, type: string}
      artifact_name: {required: true, type: string}
      plans_sha256: {required: true, type: string}
      training_index_proof_sha256: {required: true, type: string}
permissions:
  contents: read
  actions: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    steps:
      - name: Retain lifecycle helper from the exact workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/worker-lifecycle-helper"
          gh api "repos/$GITHUB_REPOSITORY/contents/src/ebpf_discovery/worker_process_group_v4.py?ref=$GITHUB_SHA" \
            > "$RUNNER_TEMP/worker-lifecycle-helper/source-api.json"
          python - <<'PY'
          import base64,hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'worker-lifecycle-helper'
          metadata=json.loads((root/'source-api.json').read_text())
          if (metadata.get('type')!='file'
                  or metadata.get('path')!='src/ebpf_discovery/worker_process_group_v4.py'):
              raise SystemExit('workflow lifecycle helper source identity mismatch')
          source=base64.b64decode(''.join(metadata['content'].split()),validate=True)
          if len(source)!=metadata.get('size'):
              raise SystemExit('workflow lifecycle helper source size mismatch')
          (root/'worker_process_group_v4.py').write_bytes(source)
          proof={'schema_version':'worker-lifecycle-helper-source-v4',
              'workflow_sha':os.environ['GITHUB_SHA'],'repository':os.environ['GITHUB_REPOSITORY'],
              'path':metadata['path'],'git_blob_sha':metadata.get('sha'),'bytes':len(source),
              'sha256':hashlib.sha256(source).hexdigest(),'api_url':metadata.get('url')}
          (root/'source-proof.json').write_text(json.dumps(proof,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact experiment implementation
        run: python -m pip install -e . opentelemetry-proto
      - name: Bind and download the immutable parent checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          mkdir -p work/worker-artifact/infrastructure work/worker-input
          cp "$RUNNER_TEMP/worker-lifecycle-helper/worker_process_group_v4.py" \
            work/worker-artifact/infrastructure/resource-sampler-helper.py
          cp "$RUNNER_TEMP/worker-lifecycle-helper/source-proof.json" \
            work/worker-artifact/infrastructure/resource-sampler-helper-source.json
          printf '%s' "$INPUTS_JSON" > work/worker-input/expected.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ inputs.artifact_id }}" \
            > work/worker-input/artifact-api.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/${{ inputs.run_id }}" \
            > work/worker-input/parent-run-api.json
          python - <<'PY'
          import json, os, pathlib
          expected=json.loads(pathlib.Path('work/worker-input/expected.json').read_text())
          artifact=json.loads(pathlib.Path('work/worker-input/artifact-api.json').read_text())
          run=json.loads(pathlib.Path('work/worker-input/parent-run-api.json').read_text())
          parent=artifact.get('workflow_run') or {}
          if (expected.get('parent_repository') != os.environ['GITHUB_REPOSITORY']
                  or run.get('id') != int(expected['run_id'])
                  or run.get('head_sha') != expected['commit']
                  or run.get('run_attempt') != int(expected['parent_run_attempt'])
                  or run.get('status') != 'in_progress'
                  or artifact.get('id') != int(expected['artifact_id'])
                  or artifact.get('name') != expected['artifact_name']
                  or artifact.get('digest') != expected['artifact_digest']
                  or artifact.get('expired') is True
                  or parent.get('id') != int(expected['run_id'])
                  or parent.get('head_sha') != expected['commit']):
              raise SystemExit('checkpoint Actions artifact metadata differs from dispatched identity')
          expected.update(worker_workflow_sha=os.environ['GITHUB_SHA'],
                          worker_run_id=os.environ['GITHUB_RUN_ID'],
                          worker_run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
                          artifact_api={'id':artifact['id'],'name':artifact['name'],
                              'digest':artifact['digest'],'size_in_bytes':artifact.get('size_in_bytes'),
                              'workflow_run':parent})
          pathlib.Path('work/worker-input/expected.json').write_text(json.dumps(expected,indent=2)+'\n')
          PY
          /usr/bin/time -v -o work/worker-artifact/infrastructure/checkpoint-download-time.txt \
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ inputs.artifact_id }}/zip" \
            > work/worker-input/checkpoint.zip
          printf '%s  %s\n' "${{ inputs.artifact_digest }}" work/worker-input/checkpoint.zip \
            | sed 's/^sha256://' > work/worker-input/checkpoint.sha256
          sha256sum --check work/worker-input/checkpoint.sha256
      - name: Allocate measured swap on the standard worker
        run: bash scripts/setup-v4-swap.sh work/worker-artifact/infrastructure/swap
      - name: Execute the unchanged full-prefix toolchain
        env:
          PYTHONPATH: src
        run: |
          set +e
          python work/worker-artifact/infrastructure/resource-sampler-helper.py \
            --evidence work/worker-artifact/infrastructure/resource-sampler-lifecycle.json \
            --label worker-resource-sampler -- \
            bash scripts/capture-v4-resources.sh \
              work/worker-artifact/infrastructure/resources 15 work/no-guests &
          sampler=$!
          printf '%s\n' "$sampler" > work/worker-artifact/infrastructure/resource-sampler.pid
          (
            while true; do
              find work/campaign/toolchain -type f -name bering.log -print0 2>/dev/null \
                | while IFS= read -r -d '' log; do
                    printf 'BERING_GC_HEARTBEAT '
                    stat --printf='path=%n inode=%i bytes=%s mtime=%Y\n' "$log"
                    tail -n 400 "$log" | grep -E '^gc [0-9]+ ' | tail -n 3 | cut -c1-1000 || true
                  done
              sleep 60
            done
          ) &
          gc_heartbeat=$!
          printf '%s\n' "$gc_heartbeat" > work/worker-artifact/infrastructure/gc-heartbeat.pid
          /usr/bin/time -v -o work/worker-artifact/infrastructure/toolchain-time.txt \
            python -m ebpf_discovery.remote_toolchain_v4 worker \
              --checkpoint-zip work/worker-input/checkpoint.zip \
              --campaign-root work/campaign \
              --artifact-root work/worker-artifact \
              --expected work/worker-input/expected.json
          code=$?
          kill -TERM "$gc_heartbeat" 2>/dev/null || true
          wait "$gc_heartbeat" 2>/dev/null || true
          kill -TERM "$sampler" 2>/dev/null || true
          wait "$sampler"
          sampler_code=$?
          if [[ "$code" != 0 ]]; then
            exit "$code"
          fi
          exit "$sampler_code"
      - name: Retain worker environment and resource evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/worker-artifact/infrastructure
          uname -a > work/worker-artifact/infrastructure/runner-final.txt
          free -b >> work/worker-artifact/infrastructure/runner-final.txt
          swapon --show --bytes >> work/worker-artifact/infrastructure/runner-final.txt
          df -B1 >> work/worker-artifact/infrastructure/runner-final.txt
          du -B1 -s work/worker-artifact work/worker-input work/campaign \
            > work/worker-artifact/infrastructure/final-disk-bytes.txt 2>&1 || true
          ps -eo pid,ppid,rss,vsz,%cpu,%mem,etimes,comm,args --sort=-rss \
            > work/worker-artifact/infrastructure/processes-final.txt
          python -m pip freeze > work/worker-artifact/infrastructure/python-environment.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            > work/worker-artifact/infrastructure/workflow-jobs.json \
            2>work/worker-artifact/infrastructure/workflow-jobs.err || true
      - name: Verify resource writer quiescence before packaging
        id: lifecycle_gate
        if: always()
        env:
          SYSTEM: ${{ inputs.system }}
        run: |
          set +e
          infra=work/worker-artifact/infrastructure
          python "$infra/resource-sampler-helper.py" --verify-lifecycle \
            --evidence "$infra/resource-sampler-lifecycle.json" \
            --source-proof "$infra/resource-sampler-helper-source.json" \
            --helper "$infra/resource-sampler-helper.py" \
            --workflow-sha "$GITHUB_SHA" \
            --gate "$infra/resource-sampler-package-gate.json"
          gate_code=$?
          if [[ "$gate_code" != 0 && "$SYSTEM" == deathstarbench ]]; then
            mkdir -p work/worker-package/failure-proof
            for name in resource-sampler-lifecycle.json resource-sampler-helper-source.json \
                        resource-sampler-helper.py resource-sampler-package-gate.json; do
              test ! -f "$infra/$name" || cp "$infra/$name" work/worker-package/failure-proof/
            done
            test ! -f work/worker-artifact/worker-status.json || \
              cp work/worker-artifact/worker-status.json work/worker-package/failure-proof/
          fi
          exit "$gate_code"
      - name: Package the complete DSB worker output losslessly
        if: always() && inputs.system == 'deathstarbench' && steps.lifecycle_gate.outcome == 'success'
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m ebpf_discovery.artifact_transport_v4 package \
            --source work/worker-artifact --out work/worker-package --kind worker || {
              mkdir -p work/worker-package/failure-proof
              if test -f work/worker-artifact/worker-status.json; then
                cp work/worker-artifact/worker-status.json work/worker-package/failure-proof/
              fi
              for name in toolchain-time.txt runner-final.txt final-disk-bytes.txt; do
                if test -f "work/worker-artifact/infrastructure/$name"; then
                  cp "work/worker-artifact/infrastructure/$name" work/worker-package/failure-proof/
                fi
              done
              exit 1
            }
      - uses: actions/upload-artifact@v4
        if: always() && inputs.system == 'deathstarbench'
        with:
          name: toolchain-v4-${{ inputs.system }}-${{ inputs.mode }}-${{ inputs.seed }}-${{ github.run_id }}
          path: work/worker-package/
          compression-level: 0
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && inputs.system != 'deathstarbench'
        with:
          name: toolchain-v4-${{ inputs.system }}-${{ inputs.mode }}-${{ inputs.seed }}-${{ github.run_id }}
          path: work/worker-artifact/
          compression-level: 1
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
