name: Read the fixed completed full PC summary v6
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the fixed original publication and omit only the two assignment arrays
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, stat, time
          import urllib.error, urllib.parse, urllib.request, zipfile

          REPO='a-a-k/ebpf-model-discovery-experiments'
          RUN=42267236483; SOURCE='9d6414e8824331d368d1732a15200cdad691350b'
          ARTIFACT=13551961317; SIZE=7627074
          SHA='1603bd0c5bcc34866299df24fa16aacc3ec0f095e9d393bc5a3dfd6fbe694b1d'
          ARMS=('none','obi','coroot','deepflow')
          OMIT=('class_test_assignments','target_descriptive_assignments')
          if os.environ.get('GITHUB_ACTIONS')!='true' or os.environ.get('GITHUB_REPOSITORY')!=REPO:
              raise RuntimeError('this fixed completed-result reader is repository Actions only')
          root=pathlib.Path('work/full-PC-summary');root.mkdir(parents=True)
          out=root/'full-PC-summary-projection.json';archive=root/'original.zip'
          started=time.time_ns();cpu=os.times()
          result={'scope':'Literal completed full PC result projection; no refit or new scientific calculation',
              'execution':{'run_id':os.environ['GITHUB_RUN_ID'],'source':os.environ['GITHUB_SHA']},
              'fixed_original':{'run_id':RUN,'source':SOURCE,'artifact_id':ARTIFACT,'bytes':SIZE,'sha256':SHA},
              'only_omitted_paths':['frozen_classification.'+k for k in OMIT],
              'all_other_original_fields_preserved':None,'new_scientific_cell':False,'status':'started','arms':{},
              'host':{'cpu_count':os.cpu_count(),'allowed_CPUs':sorted(os.sched_getaffinity(0)),
                      'memory':pathlib.Path('/proc/meminfo').read_text(),'free_bytes_before':shutil.disk_usage(root).free}}
          def save():
              pending=out.with_suffix('.pending')
              pending.write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n',encoding='utf8')
              os.replace(pending,out)
          def check(ok,reason):
              if not ok:raise ValueError(reason)
          def origin(value):
              return (value.get('system'),value.get('mode'),value.get('seed'),value.get('smoke'),
                      value.get('stage'),str(value.get('run_id')),value.get('commit'))==(
                      'petclinic','full',9,False,'qualification',str(RUN),SOURCE)
          save()
          try:
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json',
                       'X-GitHub-Api-Version':'2026-03-10'}
              url=f'https://api.github.com/repos/{REPO}/actions/artifacts/{ARTIFACT}'
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=60) as response:
                  actual=json.load(response)
              parent=actual.get('workflow_run') or {}
              check((actual.get('id'),actual.get('name'),actual.get('size_in_bytes'),actual.get('digest'),
                  actual.get('expired'),parent.get('id'),parent.get('head_sha'))==(
                  ARTIFACT,f'v6-validation-summary-{RUN}',SIZE,'sha256:'+SHA,False,RUN,SOURCE),'fixed artifact API differs')
              result['actual_artifact_API']=actual;save()
              check(shutil.disk_usage(root).free>=SIZE+2*1024**3,'insufficient reader workspace')
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,req,fp,code,msg,headers,newurl):return None
              try:response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url+'/zip',headers=headers),timeout=60)
              except urllib.error.HTTPError as error:
                  if error.code!=302:raise
                  target=error.headers.get('Location','');parsed=urllib.parse.urlsplit(target)
                  check(parsed.scheme=='https' and parsed.hostname and any(parsed.hostname.endswith(s) for s in
                      ('.blob.core.windows.net','.githubusercontent.com','.actions.githubusercontent.com')),'unexpected delivery host')
                  response=urllib.request.urlopen(target,timeout=60)
              digest=hashlib.sha256();total=0
              with response,archive.open('xb') as stream:
                  while data:=response.read(1024**2):
                      total+=len(data);check(total<=SIZE,'original ZIP exceeds exact bytes');digest.update(data);stream.write(data)
              check(total==SIZE and digest.hexdigest()==SHA,'whole original ZIP bytes/SHA differ')
              with zipfile.ZipFile(archive) as zipped:
                  infos=zipped.infolist();names=[i.filename for i in infos]
                  check(len(names)==len(set(names)),'duplicate ZIP member')
                  check({n for n in names if n.startswith('summaries/')}=={f'summaries/{c}.json' for c in ARMS},'exact four summaries required')
                  for info in infos:
                      p=pathlib.PurePosixPath(info.filename)
                      check(not p.is_absolute() and '..' not in p.parts and '\\' not in info.filename
                          and stat.S_IFMT(info.external_attr>>16) in (0,stat.S_IFREG,stat.S_IFDIR)
                          and not info.flag_bits&1,'unsafe/link/encrypted ZIP member')
                  raw={n:zipped.read(n) for n in ['block-plan.json','block-all-forecasts-frozen.json']+
                      [f'publications/validation/{c}{s}.json' for c in ARMS for s in ('-before-upload','')]}
                  plan=json.loads(raw['block-plan.json']);freeze=json.loads(raw['block-all-forecasts-frozen.json'])
                  check((plan['system'],plan['mode'],plan['repetition'],plan['run_id'],plan['source'])==(
                      'petclinic','full',9,RUN,SOURCE),'original common plan differs')
                  models={m['case']['collector']:m for m in freeze['models']}
                  check(len(freeze['models'])==4 and set(models)==set(ARMS) and freeze['all_four_frozen_before_targets'] is True,'original four-model freeze differs')
                  result['original_metadata']={'plan':plan,'freeze':freeze,'members':{
                      n:{'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()} for n,body in raw.items()}}
                  result['ZIP_member_integrity']={}
                  for info in infos:
                      digest=hashlib.sha256();count=0;collector=next((c for c in ARMS if info.filename==f'summaries/{c}.json'),None)
                      temporary=root/'one-original-summary.json'
                      stream=temporary.open('xb') if collector else None
                      try:
                          with zipped.open(info) as member:
                              while data:=member.read(1024**2):
                                  digest.update(data);count+=len(data)
                                  if stream:stream.write(data)
                      finally:
                          if stream:stream.close()
                      check(count==info.file_size,'incomplete original member')
                      result['ZIP_member_integrity'][info.filename]={'bytes':count,'sha256':digest.hexdigest(),'CRC32':f'{info.CRC:08x}'}
                      if collector:
                          before_name=f'publications/validation/{collector}-before-upload.json'
                          before=json.loads(raw[before_name]);published=json.loads(raw[f'publications/validation/{collector}.json'])
                          expected=before['files']['evaluation-v6.json'];original=json.loads(temporary.read_text(encoding='utf8'))
                          model=models[collector];cell=original['cell'];api=published['artifact_API']
                          check((count,digest.hexdigest())==(expected['bytes'],expected['sha256']),'full original evaluation bytes/SHA differ')
                          check(origin(cell) and origin(model['case']) and cell['collector']==collector and cell['phase']=='validation'
                              and model['case']['phase']=='training' and cell['blueprint_sha256']==model['case']['blueprint_sha256']==plan['blueprint_sha256'],'cell/source/blueprint differs')
                          check(original['validation_closed_input_sha256']==before['closed_input_sha256']==before['files']['closed-input.json']['sha256']==published['closed_input_sha256'],'closed input binding differs')
                          check(original['forecast_manifest_sha256']==model['forecast_manifest_sha256']
                              and freeze['verified_ns']<cell['started_ns'],'prospective frozen manifest binding differs')
                          check(published['complete_local_inventory_sha256']==hashlib.sha256(raw[before_name]).hexdigest()
                              and api['name']==f'v6-validation-{collector}-{RUN}' and api['workflow_run']['id']==RUN
                              and api['workflow_run']['head_sha']==SOURCE,'original publication/source inventory differs')
                          classification=original['frozen_classification'];omitted={}
                          for key in OMIT:
                              value=classification.pop(key,None)
                              omitted[key]={'present':value is not None,'items':len(value) if isinstance(value,(list,dict)) else None}
                              del value
                          result['arms'][collector]={'literal_summary':original,'omitted':omitted,
                              'original_evaluation':expected,'original_publication':published,'original_forecast':model}
                          temporary.unlink();save()
                  result['all_original_ZIP_members_EOF_CRC_verified']=True
              archive.unlink();result.update(status='complete',all_other_original_fields_preserved=True,
                  verified_local_delivery_released=True,cloud_original_untouched=True)
          except BaseException as error:
              result.update(status='failed',error=repr(error));raise
          finally:
              end=os.times();result['cost']={'started_ns':started,'ended_ns':time.time_ns(),
                  'CPU_seconds':{k:getattr(end,k)-getattr(cpu,k) for k in ('user','system','children_user','children_system')},
                  'free_bytes_after':shutil.disk_usage(root).free};save()
              print(json.dumps({'output':str(out),'bytes':out.stat().st_size,'sha256':hashlib.sha256(out.read_bytes()).hexdigest(),'status':result['status']}))
          PY
      - name: Publish the literal result projection, integrity references and actual reader cost
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixed-full-PC-summary-v6-${{ github.run_id }}
          path: work/full-PC-summary/full-PC-summary-projection.json
          if-no-files-found: warn
          compression-level: 6
