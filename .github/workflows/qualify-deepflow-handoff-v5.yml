name: Qualify DeepFlow derived OTLP handoff v5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest opentelemetry-proto
      - name: Run focused source and handoff checks
        run: |
          python -m pytest --import-mode=importlib \
            tests/test_deepflow_handoff_v5.py \
            tests/test_deepflow_codec_v5.py \
            tests/test_raw_v4.py \
            tests/test_checkpoint_v4.py \
            tests/test_toolchain_v5.py -q \
            | tee focused-tests.log
      - name: Build exact graph-v5 product pins
        run: |
          chmod +x scripts/setup-toolchain-v4.sh
          PYTHONPATH=src scripts/setup-toolchain-v4.sh work/toolchain-build v5
      - name: Run no-VM actual-product input qualification
        run: |
          PYTHONPATH=src python scripts/qualify-deepflow-handoff-v5.py \
            --out work/deepflow-handoff-qualification \
            --toolchain-build work/toolchain-build
      - name: Retain runner and preparation costs
        if: always()
        run: |
          mkdir -p work/qualification-environment
          cp focused-tests.log work/qualification-environment/ 2>/dev/null || true
          uname -a > work/qualification-environment/runner.txt
          python -m pip freeze > work/qualification-environment/python-environment.txt
          cp work/toolchain-build/toolchain-build.json work/toolchain-build/pins.tsv \
             work/toolchain-build/builds.tsv work/qualification-environment/ 2>/dev/null || true
          cp -r work/toolchain-build/logs work/qualification-environment/toolchain-logs \
             2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepflow-derived-handoff-v5-${{ github.run_id }}
          path: |
            work/deepflow-handoff-qualification/
            work/qualification-environment/
          retention-days: 90
          if-no-files-found: error
