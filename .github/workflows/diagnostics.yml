name: Diagnose retained experiment results
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        system: [deathstarbench, otel_demo, petclinic]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Paired retrospective diagnostics on all retained campaigns
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: python -m ebpf_discovery.diagnostics --system '${{ matrix.system }}' --out results/iteration-2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ matrix.system }}-${{ github.run_id }}
          path: results/iteration-2/
          retention-days: 90
  report:
    needs: diagnose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: diagnostics-*
          path: work/diagnostic-inputs
      - run: python -m ebpf_discovery.diagnostic_report --inputs work/diagnostic-inputs --out results/iteration-2
      - name: Record completed diagnostic job costs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > results/iteration-2/workflow-jobs.json
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostics-report-${{ github.run_id }}
          path: results/iteration-2/
          retention-days: 90
