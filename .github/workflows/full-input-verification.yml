name: Verify the permanent full-input archive

on:
  workflow_dispatch:
    inputs:
      index_id:
        description: Exact full-input-index.json Release asset ID
        required: true
        type: string
      index_bytes:
        description: Exact index byte count
        required: true
        type: string
      index_sha256:
        description: Exact index SHA-256
        required: true
        type: string
      publication_index_asset_id:
        description: Existing fixed publication archive index asset ID
        required: true
        type: string
      publication_index_bytes:
        description: Existing fixed publication archive index byte count
        required: true
        type: string
      publication_index_sha256:
        description: Existing fixed publication archive index SHA-256
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: src:.
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . opentelemetry-proto
      - name: Record standard worker resources
        run: python -m ebpf_discovery.resources_v6 --report work/archive-verify-host-resources.json
      - name: Import representative model and shared packages from the full archive
        run: >-
          python -m ebpf_discovery.full_input_archive import-check
          --index-id '${{ inputs.index_id }}'
          --index-bytes '${{ inputs.index_bytes }}'
          --index-sha256 '${{ inputs.index_sha256 }}'
      - name: Rebuild the predeclared observation-to-model technical sample
        run: >-
          python -m ebpf_discovery.full_input_archive model-sample
          --index-id '${{ inputs.index_id }}'
          --index-bytes '${{ inputs.index_bytes }}'
          --index-sha256 '${{ inputs.index_sha256 }}'
      - name: Reproduce all 108 published cases from the fixed Release archive
        run: >-
          python -m ebpf_discovery.publication_archive replay
          --index-asset-id '${{ inputs.publication_index_asset_id }}'
          --index-bytes '${{ inputs.publication_index_bytes }}'
          --index-sha256 '${{ inputs.publication_index_sha256 }}'
      - name: Recheck the corrected 36-case Social Network publication
        run: python scripts/check-compose-correction-replay.py
      - name: Publish verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-input-verification-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            work/archive-verify-host-resources.json
            work/full-input-archive/archive-import-proof.json
            work/full-input-archive/model-sample-proof.json
            work/full-input-archive/execution.json
            work/publication-archive/proof.json
            work/correction-report-replay/receipt.json
          retention-days: 90
          if-no-files-found: warn
