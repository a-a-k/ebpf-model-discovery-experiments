name: Validate v5 DeepFlow checkpoint accounting equivalence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest
      - name: Run focused checks
        run: |
          python -m pytest --import-mode=importlib tests/test_checkpoint_v4.py -q | tee focused-tests.log
          python -m py_compile scripts/validate-deepflow-checkpoint-accounting-v5.py
      - name: Fetch pinned saved DeepFlow checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/deepflow-checkpoint-validation-input
          gh api repos/a-a-k/ebpf-model-discovery-experiments/actions/runs/40936796228 \
            > work/deepflow-checkpoint-validation-input/run-api.json
          gh api repos/a-a-k/ebpf-model-discovery-experiments/actions/artifacts/12923969985 \
            > work/deepflow-checkpoint-validation-input/artifact-api.json
          gh api -H 'Accept: application/vnd.github+json' \
            repos/a-a-k/ebpf-model-discovery-experiments/actions/artifacts/12923969985/zip \
            > work/deepflow-checkpoint-validation-input/checkpoint.zip
      - name: Compare old and streamed dependency proofs
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/validate-deepflow-checkpoint-accounting-v5.py \
            --archive work/deepflow-checkpoint-validation-input/checkpoint.zip \
            --artifact-metadata work/deepflow-checkpoint-validation-input/artifact-api.json \
            --run-metadata work/deepflow-checkpoint-validation-input/run-api.json \
            --out work/deepflow-checkpoint-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepflow-checkpoint-accounting-validation-v5-${{ github.run_id }}
          path: |
            work/deepflow-checkpoint-validation/
            work/deepflow-checkpoint-validation-input/run-api.json
            work/deepflow-checkpoint-validation-input/artifact-api.json
            focused-tests.log
          retention-days: 90
          if-no-files-found: error
