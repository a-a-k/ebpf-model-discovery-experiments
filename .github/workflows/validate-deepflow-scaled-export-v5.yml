name: Validate bounded DeepFlow export preparation v5
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . pytest opentelemetry-proto
      - name: Run focused bounded-preparation checks
        run: |
          python -m pytest --import-mode=importlib \
            tests/test_deepflow_handoff_v5.py tests/test_identity_projection_v5.py \
            tests/test_raw_v4.py tests/test_bering_v4.py \
            tests/test_validate_deepflow_scaled_export_v5.py -q | tee focused-tests.log
          python -m py_compile scripts/validate-deepflow-scaled-export-v5.py
          python scripts/validate-deepflow-scaled-export-v5.py --help >/dev/null
      - name: Build exact graph-v5 product pins
        run: |
          chmod +x scripts/setup-toolchain-v4.sh
          PYTHONPATH=src scripts/setup-toolchain-v4.sh work/toolchain-build v5
      - name: Fetch exact immutable failed-main training checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work/deepflow-scaled-export-input
          gh api repos/a-a-k/ebpf-model-discovery-experiments/actions/runs/40965631880 \
            > work/deepflow-scaled-export-input/run-api.json
          gh api repos/a-a-k/ebpf-model-discovery-experiments/actions/artifacts/12941184407 \
            > work/deepflow-scaled-export-input/artifact-api.json
          /usr/bin/time -v -o work/deepflow-scaled-export-input/download-resource.txt \
            gh api -H 'Accept: application/vnd.github+json' \
            repos/a-a-k/ebpf-model-discovery-experiments/actions/artifacts/12941184407/zip \
            > work/deepflow-scaled-export-input/training.zip
      - name: Validate old/new requests and two actual Bering storage layouts
        env:
          PYTHONPATH: src:.
        run: |
          /usr/bin/time -v -o work/deepflow-scaled-export-input/qualification-resource.txt \
            python scripts/validate-deepflow-scaled-export-v5.py \
            --archive work/deepflow-scaled-export-input/training.zip \
            --artifact-metadata work/deepflow-scaled-export-input/artifact-api.json \
            --run-metadata work/deepflow-scaled-export-input/run-api.json \
            --toolchain-build work/toolchain-build \
            --out work/deepflow-scaled-export-validation
      - name: Retain environment and preparation costs
        if: always()
        run: |
          mkdir -p work/deepflow-scaled-export-environment
          cp focused-tests.log work/deepflow-scaled-export-environment/ 2>/dev/null || true
          cp work/deepflow-scaled-export-input/run-api.json \
             work/deepflow-scaled-export-input/artifact-api.json \
             work/deepflow-scaled-export-input/download-resource.txt \
             work/deepflow-scaled-export-input/qualification-resource.txt \
             work/deepflow-scaled-export-environment/ 2>/dev/null || true
          cp work/toolchain-build/toolchain-build.json work/toolchain-build/pins.tsv \
             work/toolchain-build/builds.tsv work/deepflow-scaled-export-environment/ 2>/dev/null || true
          uname -a > work/deepflow-scaled-export-environment/runner.txt
          python -m pip freeze > work/deepflow-scaled-export-environment/python-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepflow-scaled-export-validation-v5-${{ github.run_id }}
          path: |
            work/deepflow-scaled-export-validation/qualification.json
            work/deepflow-scaled-export-validation/failure.json
            work/deepflow-scaled-export-validation/checkpoint-members.jsonl
            work/deepflow-scaled-export-validation/original-raw_v4.py
            work/deepflow-scaled-export-validation/candidate/exports/*request-index.jsonl
            work/deepflow-scaled-export-validation/alternate-layout/*request-index.jsonl
            work/deepflow-scaled-export-validation/bering-layout-*/model-runtime/replay-command.json
            work/deepflow-scaled-export-validation/bering-layout-*/model-runtime/accepted-stream-requests.jsonl
            work/deepflow-scaled-export-validation/bering-layout-*/model-runtime/accepted-request-sequence.jsonl
            work/deepflow-scaled-export-validation/bering-layout-*/model-runtime/serve.yaml
            work/deepflow-scaled-export-validation/bering-layout-*/model.json
            work/deepflow-scaled-export-validation/bering-layout-*/model.snapshot.json
            work/deepflow-scaled-export-validation/bering-layout-*/model.signal-quality.json
            work/deepflow-scaled-export-environment/
          retention-days: 90
          if-no-files-found: warn
