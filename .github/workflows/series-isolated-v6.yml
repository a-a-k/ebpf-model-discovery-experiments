          work/case/forecast-saved.json
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 0
      if: ${{ always() }}
    outputs:
      artifact_id: ${{ steps.captureupload.outputs.artifact-id }}
      artifact_digest: ${{ steps.captureupload.outputs.artifact-digest }}
      artifact_name: ${{ steps.capture.outputs.artifact_name }}
      collector: ${{ steps.capture.outputs.collector }}
