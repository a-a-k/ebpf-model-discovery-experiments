# Explicit job slots retain exact upstream IDs across built-in failed-job retries.
name: Isolated arm study v6 (24 blocks and registered DSB retry)
run-name: v6 isolated ${{ inputs.stage }} ${{ inputs.system }}/${{ inputs.mode }} r${{ inputs.repetition }} full
'on':
  workflow_dispatch:
    inputs:
      system:
        type: choice
        options:
        - petclinic
        - otel_demo
        - deathstarbench
        required: true
      mode:
        type: choice
        options:
        - absent
        - partial
        - full
        required: true
      repetition:
        type: choice
        options:
        - '9'
        - '10'
        - '11'
        required: true
      stage:
        type: choice
        options:
        - qualification
        - main
        default: qualification
        description: Always full counts; main requires the exact reviewed source gate
permissions:
  contents: read
  actions: read
env:
  PYTHONPATH: src
  PYTHONUNBUFFERED: '1'
  GH_TOKEN: ${{ github.token }}
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: |-
          .github
          docs
          scripts
          src
          systems
          tests
          pyproject.toml
          README.md
          AGENTS.md
        sparse-checkout-cone-mode: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install the unchanged application/model dependencies
      run: python -m pip install -e . opentelemetry-proto
    - name: Use and record the full standard worker envelope
      run: python -m ebpf_discovery.resources_v6 --report work/host-resources.json
    - name: Retain the actual worker before long work
      uses: actions/upload-artifact@v4
      with:
        name: v6-isolated-host-${{ github.job }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
        path: work/host-resources.json
        compression-level: 6
    - name: Prepare one new shared sealed application and guest blueprint
      run: python -m ebpf_discovery.isolated_arm_v6 prepare --system "${{ inputs.system }}" --mode "${{ inputs.mode }}" --repetition
        "${{ inputs.repetition }}" --stage "${{ inputs.stage }}" --root work
      id: prepare
    - name: ${{ steps.prepare.outputs.artifact_name }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.prepare.outputs.artifact_name }}
        path: |-
          work/shared.tar.gz
          work/shared.tar.gz.json
          work/shared-seal.json
          work/block-plan.json
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 0
      id: shared
      if: ${{ success() }}
    - name: v6-isolated-metadata-${{ github.job }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
      uses: actions/upload-artifact@v4
      with:
        name: v6-isolated-metadata-${{ github.job }}-${{ github.run_id }}-attempt${{ github.run_attempt }}
        path: |-
          work/host-resources.json
          work/block-plan.json
          work/isolated-controller-cost.jsonl
          work/isolated-*-status.json
          work/block-*-status.json
          work/block-disk-guards.jsonl
          work/block-vm-commands.jsonl
          work/isolated-shared-import.json
          work/isolated-allocation.json
          work/block-all-forecasts-frozen.json
          work/publications/
          work/summaries/
          work/vms/events/
          work/vms/history/*/infrastructure.json
          work/vms/history/*/owned-stop.json
          work/vms/history/*/*/check.txt
          work/vms/history/*/*/serial.log
          work/vms/serial-log-access.jsonl
          work/blueprint-preparation/v6-blueprint-preparation.json
          work/blueprint-preparation/commands.jsonl
          work/vms/preparation/infrastructure.json
          work/vms/preparation/*/check.txt
          work/vms/preparation/*/serial.log
          work/capture-input/verified-import.json
          work/model-input/*/verified-import.json
          work/tools/builds.tsv
          work/tools/pins.tsv
          work/tools/logs/
          work/case/processing-execution.json
          work/case/model-worker-resources.json
          work/case/forecast-saved.json
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 0
      if: ${{ always() }}
    outputs:
      artifact_id: ${{ steps.shared.outputs.artifact-id }}
      artifact_digest: ${{ steps.shared.outputs.artifact-digest }}
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
      block_plan_sha256: ${{ steps.prepare.outputs.block_plan_sha256 }}
      shared_sha256: ${{ steps.prepare.outputs.shared_sha256 }}
  training0:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      V6_SHARED_ARTIFACT: ${{ toJSON(needs.prepare.outputs) }}
      V6_BLOCK_PLAN_SHA256: ${{ needs.prepare.outputs.block_plan_sha256 }}
      V6_SHARED_SHA256: ${{ needs.prepare.outputs.shared_sha256 }}
    steps:
    - uses: actions/checkout@v4
