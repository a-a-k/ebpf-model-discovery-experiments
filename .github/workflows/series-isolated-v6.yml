        "${{ inputs.repetition }}" --stage "${{ inputs.stage }}" --root work --capture-phase training --slot 0
      id: capture
    - name: Package complete or partial unchanged training input
      run: python -m ebpf_discovery.block_v6 package-capture --root work --capture-phase training --slot 0
      id: package
      if: ${{ always() && steps.capture.outputs.collector != '' }}
    - name: ${{ steps.capture.outputs.artifact_name }}
