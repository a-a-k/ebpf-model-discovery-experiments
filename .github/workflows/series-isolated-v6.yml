        "${{ inputs.repetition }}" --stage "${{ inputs.stage }}" --root work --capture-phase training --slot 0 --artifact-id
        "${{ steps.captureupload.outputs.artifact-id }}" --artifact-digest "${{ steps.captureupload.outputs.artifact-digest
