          ${{ steps.package.outputs.manifest_path }}
        if-no-files-found: error
        include-hidden-files: true
        compression-level: 0
      id: captureupload
      if: ${{ always() && steps.package.outcome == 'success' }}
    - name: Release only the verified exact published working capture
