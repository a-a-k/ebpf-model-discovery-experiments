          work/isolated-controller-cost.jsonl
          work/isolated-*-status.json
          work/block-*-status.json
          work/block-disk-guards.jsonl
          work/block-vm-commands.jsonl
          work/isolated-shared-import.json
          work/isolated-allocation.json
          work/block-all-forecasts-frozen.json
          work/publications/
          work/summaries/
          work/vms/events/
          work/vms/history/*/infrastructure.json
