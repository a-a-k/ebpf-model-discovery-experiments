name: Compare immutable RPC input through two Bering revisions
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
      - run: python -m pip install -e . opentelemetry-proto
      - name: Retain the same measured swap envelope for both binaries
        run: bash scripts/setup-v4-swap.sh work/rpc-input/infrastructure
      - name: Build exact old and new generic discovery binaries
        run: |
          set -euo pipefail
          mkdir -p work/rpc-build
          git clone --filter=blob:none --no-checkout https://github.com/MB3R-Lab/Bering.git work/rpc-build/repository
          git -C work/rpc-build/repository fetch origin 70d4145d3e26f11d8b3fb5be8917c50c1c6d8c2a 400971d64d65518c3b0a101bfcd1c41a9cbcaefc
          git -C work/rpc-build/repository worktree add --detach ../old 70d4145d3e26f11d8b3fb5be8917c50c1c6d8c2a
          git -C work/rpc-build/repository worktree add --detach ../new 400971d64d65518c3b0a101bfcd1c41a9cbcaefc
          study_bin_dir="$(realpath work/rpc-build)"
          for label in old new; do
            (cd "work/rpc-build/$label" && GOTOOLCHAIN=local go build -o "$study_bin_dir/bering-$label" ./cmd/bering)
          done
          go version > work/rpc-build/go-version.txt
          sha256sum work/rpc-build/bering-old work/rpc-build/bering-new > work/rpc-build/binary-SHA256SUMS.txt
      - name: Retrieve the exact immutable source archive and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p work/rpc-input
          gh api repos/a-a-k/ebpf-model-discovery-experiments/actions/artifacts/12950018152 > work/rpc-input/artifact-api.json
          gh api repos/a-a-k/ebpf-model-discovery-experiments/actions/runs/40971766251 > work/rpc-input/run-api.json
          gh api -H 'Accept: application/vnd.github+json' repos/a-a-k/ebpf-model-discovery-experiments/actions/artifacts/12950018152/zip > work/rpc-input/source.zip
      - name: Compare complete frozen input, RPC fields and actual Bering outputs
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/compare-rpc-discovery.py --archive work/rpc-input/source.zip \
            --metadata work/rpc-input/artifact-api.json --old-binary work/rpc-build/bering-old \
            --new-binary work/rpc-build/bering-new --out work/rpc-comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpc-discovery-comparison-${{ github.run_id }}
          path: |
            work/rpc-input/artifact-api.json
            work/rpc-input/run-api.json
            work/rpc-input/infrastructure/
            work/rpc-build/go-version.txt
            work/rpc-build/binary-SHA256SUMS.txt
            work/rpc-comparison/input-proof.json
            work/rpc-comparison/comparison*.json
            work/rpc-comparison/old/observed*.json
            work/rpc-comparison/new/observed*.json
            work/rpc-comparison/old/observed-runtime/*.json
            work/rpc-comparison/new/observed-runtime/*.json
            work/rpc-comparison/old/observed-runtime/serve.yaml
            work/rpc-comparison/new/observed-runtime/serve.yaml
            work/rpc-comparison/old/observed-runtime/bering.log
            work/rpc-comparison/new/observed-runtime/bering.log
          retention-days: 90
          if-no-files-found: error
