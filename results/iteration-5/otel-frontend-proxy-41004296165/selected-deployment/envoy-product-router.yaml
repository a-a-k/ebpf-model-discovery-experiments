static_resources:
  listeners:
  - name: product_catalog_grpc
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 3550
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: product_catalog
          codec_type: HTTP2
          route_config:
            name: grpc
            virtual_hosts:
            - name: all
              domains:
              - '*'
              routes:
              - match:
                  prefix: /
                route:
                  cluster: product_catalog_replicas
                  timeout: 0s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: product_catalog_replicas
    type: STATIC
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: product_catalog_replicas
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 172.28.11.21
                port_value: 3550
        - endpoint:
            address:
              socket_address:
                address: 192.168.76.12
                port_value: 13550
    health_checks:
    - timeout: 0.5s
      interval: 1s
      unhealthy_threshold: 1
      healthy_threshold: 1
      grpc_health_check: {}
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 10001
